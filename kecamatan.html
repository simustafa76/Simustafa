<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Sebaran Lembaga - SI-MUSTAFA</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root{--p:#006400;--pl:#4CAF50;--pd:#0a2e1a;--g:#FFD700;--gd:#DAA520;--bg:#f0f4f0;--cs:0 4px 20px rgba(0,0,0,0.08);--lpqa:#0a2e1a;--lpqb:#4CAF50;--mdta:#b8860b;--mdtb:#FFD700;--ppsa:#5e1073;--ppsb:#ce7be0}
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f4f0;display:flex;justify-content:center;padding:20px;overflow-y:auto}
        .main-content{flex:1;max-width:1200px;min-height:100vh;display:flex;flex-direction:column;padding:0}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);padding:14px 28px;border-radius:16px;color:white;font-weight:600;font-size:.85rem;box-shadow:0 12px 40px rgba(0,0,0,.2);z-index:9999;opacity:0;transition:all .5s cubic-bezier(.4,0,.2,1);max-width:90%}
        .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
        .toast-success{background:linear-gradient(135deg,#43a047,#2e7d32)}.toast-error{background:linear-gradient(135deg,#ef5350,#c62828)}.toast-info{background:linear-gradient(135deg,var(--p),var(--pd))}
        .spinner{width:36px;height:36px;border:3px solid #f0f2f5;border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite;margin:30px auto}
        @keyframes spin{to{transform:rotate(360deg)}}
        .empty-note{text-align:center;padding:30px;color:#999}.empty-note i{font-size:28px;display:block;margin-bottom:10px;color:var(--pl);opacity:.4}
        .main-container{background:white;border-radius:16px;box-shadow:var(--cs);overflow:hidden;padding:28px 32px 32px 32px;flex:1;display:flex;flex-direction:column}
        .container-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px;padding-bottom:16px;border-bottom:2px solid rgba(0,100,0,.08);position:relative;flex-shrink:0}
        .container-header::after{content:'';position:absolute;bottom:-2px;left:0;width:80px;height:2px;background:linear-gradient(90deg,var(--p),var(--gd));border-radius:2px}
        .container-header h1{font-size:1.2rem;font-weight:700;background:linear-gradient(135deg,var(--pd),var(--pl));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:flex;align-items:center;gap:10px}
        .container-header h1 i{background:linear-gradient(135deg,var(--p),var(--gd));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-size:1.4rem}
        .header-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
        .header-actions .updated{font-size:.7rem;color:#999;background:rgba(0,100,0,.05);padding:4px 12px;border-radius:20px;display:flex;align-items:center;gap:4px}
        .refresh-btn{padding:7px 18px;border:none;background:linear-gradient(135deg,var(--p),var(--pd));color:white;border-radius:10px;font-size:.7rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .3s ease;box-shadow:0 4px 15px rgba(0,100,0,.25);position:relative;overflow:hidden}
        .refresh-btn:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(0,100,0,.35)}
        .refresh-btn:active{transform:scale(.96)}
        .back-btn{padding:7px 16px;border:1.5px solid rgba(0,100,0,.2);background:rgba(255,255,255,.6);color:var(--pd);border-radius:10px;font-size:.7rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .3s ease;text-decoration:none}
        .back-btn:hover{background:white;border-color:var(--p);transform:translateX(-2px);box-shadow:0 4px 15px rgba(0,0,0,.06)}
        .sticky-filter-bar{position:sticky;top:0;z-index:50;background:white;padding:8px 0 12px 0;margin:-4px 0 16px 0;border-bottom:2px solid rgba(0,100,0,.06);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;flex-shrink:0}
        .sticky-filter-bar .filter-left{display:flex;align-items:center;gap:10px}.sticky-filter-bar .filter-left .filter-label{font-size:.75rem;font-weight:700;color:var(--pd);display:flex;align-items:center;gap:6px}
        .sticky-filter-bar .filter-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
        .sticky-filter-bar .filter-right .stat-chip{font-size:.7rem;color:#666;background:rgba(0,100,0,.04);padding:4px 14px;border-radius:20px;display:flex;align-items:center;gap:6px}
        .sticky-filter-bar .filter-right .stat-chip strong{color:var(--pd)}
        .content-wrapper{display:flex;gap:32px;flex:1;min-height:0}
        .chart-panel{flex:0 0 38%;min-width:260px;display:flex;flex-direction:column;align-items:center;text-align:center;background:linear-gradient(160deg,rgba(255,255,255,.5),rgba(240,248,240,.5));border-radius:20px;padding:20px 16px;border:1px solid rgba(255,255,255,.6);position:relative;overflow:hidden;align-self:flex-start}
        .chart-panel::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 40%,rgba(76,175,80,.03),transparent 60%);animation:cg 8s ease-in-out infinite;pointer-events:none}
        @keyframes cg{0%,100%{transform:translate(0,0)}50%{transform:translate(10%,5%)}}
        .chart-panel .chart-title{font-size:.85rem;font-weight:700;color:var(--pd);margin-bottom:2px;position:relative;z-index:1}
        .chart-panel .chart-sub{font-size:.7rem;color:#999;margin-bottom:12px;position:relative;z-index:1}
        .donut-wrap{position:relative;width:100%;max-width:240px;margin:0 auto;z-index:1}
        .donut-wrap canvas{filter:drop-shadow(0 8px 25px rgba(0,100,0,.08))}
        .donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
        .donut-center .num{font-size:2rem;font-weight:800;background:linear-gradient(135deg,var(--pd),var(--gd));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
        .donut-center .lbl{font-size:.55rem;color:#999;text-transform:uppercase;letter-spacing:2px;margin-top:2px;font-weight:600}
        .chart-stats{display:flex;gap:14px;justify-content:center;margin-top:12px;flex-wrap:wrap;font-size:.65rem;color:#666;position:relative;z-index:1;padding:8px 14px;background:rgba(255,255,255,.6);border-radius:14px;border:1px solid rgba(255,255,255,.8)}
        .chart-stats span{display:flex;align-items:center;gap:4px}.chart-stats strong{color:var(--pd);font-weight:700}
        .detail-panel{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
        .detail-panel .detail-title{font-size:.85rem;font-weight:700;color:var(--pd);margin-bottom:2px;display:flex;align-items:center;gap:8px;flex-shrink:0}
        .detail-panel .detail-sub{font-size:.7rem;color:#999;margin-bottom:12px;flex-shrink:0}
        .kec-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:6px;min-height:200px;max-height:600px}
        .kec-list::-webkit-scrollbar{width:6px}.kec-list::-webkit-scrollbar-track{background:rgba(0,0,0,.02);border-radius:10px}.kec-list::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--pl),var(--gd));border-radius:10px}
        .kec-item{background:linear-gradient(160deg,#ffffff 0%,#f8fbf8 100%);border:1px solid rgba(0,100,0,.06);border-radius:14px;padding:12px 16px;transition:all .3s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;flex-shrink:0;animation:ii .5s ease-out backwards}
        .kec-item:nth-child(1){animation-delay:.03s}.kec-item:nth-child(2){animation-delay:.06s}.kec-item:nth-child(3){animation-delay:.09s}.kec-item:nth-child(4){animation-delay:.12s}.kec-item:nth-child(5){animation-delay:.15s}
        @keyframes ii{from{opacity:0;transform:translateX(-20px) scale(.97)}to{opacity:1;transform:translateX(0) scale(1)}}
        .kec-item::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--pl),var(--gd));border-radius:4px 0 0 4px}
        .kec-item:hover{transform:translateX(4px) scale(1.005);box-shadow:0 8px 30px rgba(0,100,0,.1);border-color:rgba(0,100,0,.12)}
        .kec-item.empty{opacity:.55}.kec-item.empty::before{background:#ccc}
        .kec-row-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px}
        .kec-row-name{font-size:.85rem;font-weight:700;color:var(--pd);display:flex;align-items:center;gap:8px;min-width:0}
        .kec-row-rank{font-size:.6rem;font-weight:700;color:#bbb;flex-shrink:0;width:20px;text-align:center;background:rgba(0,0,0,.03);padding:2px 0;border-radius:8px}
        .kec-total-badge{background:linear-gradient(135deg,var(--pd),var(--p));color:white;font-size:.66rem;font-weight:700;padding:4px 14px;border-radius:20px;white-space:nowrap;flex-shrink:0;box-shadow:0 2px 10px rgba(0,100,0,.2)}
        .kec-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
        .pill{font-size:.64rem;font-weight:700;padding:3px 10px;border-radius:20px;color:white;display:inline-flex;align-items:center;gap:4px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
        .pill.lpq{background:linear-gradient(135deg,var(--lpqa),var(--lpqb))}.pill.mdt{background:linear-gradient(135deg,var(--mdta),var(--mdtb));color:#3a2a00}.pill.ponpes{background:linear-gradient(135deg,var(--ppsa),var(--ppsb))}
        .kec-bar{height:6px;border-radius:6px;overflow:hidden;display:flex;background:#eef2ee;box-shadow:inset 0 1px 2px rgba(0,0,0,.04)}
        .kec-bar-seg{transition:width 1s cubic-bezier(.4,0,.2,1)}.kec-bar-seg.lpq{background:linear-gradient(90deg,var(--lpqa),var(--lpqb))}.kec-bar-seg.mdt{background:linear-gradient(90deg,var(--mdta),var(--mdtb))}.kec-bar-seg.ponpes{background:linear-gradient(90deg,var(--ppsa),var(--ppsb))}.kec-bar-seg.empty{background:transparent}
        @media (max-width:900px){body{padding:12px}.main-container{padding:16px}.content-wrapper{flex-direction:column;gap:20px}.chart-panel{flex:1;padding:16px;align-self:stretch}.donut-wrap{max-width:200px}.donut-center .num{font-size:1.6rem}.kec-list{max-height:400px;min-height:150px}.container-header h1{font-size:1rem}.sticky-filter-bar{padding:6px 0 10px 0;flex-direction:column;align-items:stretch;gap:6px}}
        @media (max-width:480px){body{padding:8px}.main-container{padding:12px}.kec-item{padding:10px 12px}.kec-row-name{font-size:.75rem}.kec-total-badge{font-size:.55rem;padding:2px 10px}.pill{font-size:.55rem;padding:2px 7px}.header-actions .updated{display:none}.chart-stats{gap:8px;font-size:.55rem;padding:6px 10px}.refresh-btn{padding:5px 12px;font-size:.6rem}.back-btn{padding:5px 10px;font-size:.6rem}.kec-list{max-height:300px;min-height:120px}.container-header h1{font-size:.9rem}}
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>
    <main class="main-content">
        <div class="main-container">
            <div class="container-header">
                <h1><i class="fas fa-chart-pie"></i> Sebaran Lembaga per Kecamatan</h1>
                <div class="header-actions">
                    <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Kembali</a>
                    <span class="updated"><i class="fas fa-clock"></i> <span id="updatedAt"></span></span>
                    <button class="refresh-btn" onclick="refreshData()"><i class="fas fa-sync"></i> Refresh</button>
                </div>
            </div>
            <div class="sticky-filter-bar">
                <div class="filter-left"><span class="filter-label"><i class="fas fa-map-marker-alt"></i> Ringkasan Data</span></div>
                <div class="filter-right">
                    <span class="stat-chip"><i class="fas fa-flag"></i> Kecamatan: <strong id="totalKecStat">0</strong></span>
                    <span class="stat-chip"><i class="fas fa-calculator"></i> Total Lembaga: <strong id="totalLembagaStat">0</strong></span>
                    <span class="stat-chip"><i class="fas fa-trophy" style="color:#ffd700;"></i> Terbanyak: <strong id="topKecStat">-</strong></span>
                </div>
            </div>
            <div class="content-wrapper">
                <div class="chart-panel">
                    <div class="chart-title">Distribusi Lembaga</div>
                    <div class="chart-sub" id="chartSub">Total seluruh kecamatan</div>
                    <div class="donut-wrap"><canvas id="donutChart"></canvas><div class="donut-center"><div class="num" id="donutTotal">0</div><div class="lbl">Lembaga</div></div></div>
                    <div class="chart-stats"><span>🏙️ <strong id="totalKec">0</strong></span><span>📊 <strong id="avgLembaga">0</strong></span><span>🏆 <strong id="topKec">-</strong></span></div>
                </div>
                <div class="detail-panel">
                    <div class="detail-title">Detail per Kecamatan</div>
                    <div class="detail-sub" id="detailSub">Diurutkan dari jumlah terbanyak</div>
                    <div class="kec-list" id="kecList"><div class="spinner"></div></div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script>
        // ===== CACHE MANAGER =====
        const cache={_s:{},get(k,t=600000){const e=this._s[k];if(!e)return null;if(Date.now()-e.t>t){delete this._s[k];return null}return e.d},set(k,d){this._s[k]={d,t:Date.now()}},clear(){this._s={}}};

        // ===== TOAST =====
        function showToast(m,t='info'){const e=document.getElementById('toast');if(!e){alert(m);return}e.textContent=m;e.className=`toast toast-${t}`;void e.offsetWidth;e.classList.add('show');clearTimeout(e._to);e._to=setTimeout(()=>e.classList.remove('show'),4000)}

        // ===== TIMESTAMP =====
        function ts(){const n=new Date(),s=n.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});const e=document.getElementById('updatedAt');if(e)e.textContent=s}

        // ===== AUTH =====
        async function checkAuth(){try{const{data:{session}}=await supabaseClient.auth.getSession();if(!session){window.location.href='index.html';return false}const{data:u}=await supabaseClient.from('users').select('id,name,email,role,kecamatan_id,lembaga_id,active').eq('id',session.user.id).single();if(!u||!u.active){await supabaseClient.auth.signOut();window.location.href='index.html';return false}window.currentUser={id:u.id,name:u.name||session.user.email,email:session.user.email,role:u.role||'operator',kecamatan_id:u.kecamatan_id,lembaga_id:u.lembaga_id};return true}catch(e){window.location.href='index.html';return false}}
        function getUser(){return window.currentUser||null}
        function getRoleFilter(){const u=getUser();if(!u)return{};if(u.role==='super_admin'||u.role==='admin_kab')return{};if(!u.kecamatan_id)return{restrict:true};const f={kecamatan_id:u.kecamatan_id};if(u.role==='batko')f.jenis_lembaga='LPQ';else if(u.role==='fkdt')f.jenis_lembaga='MDT';else if(u.role==='ponpes')f.jenis_lembaga='PONPES';return f}

        // ===== FETCH LEMBAGA (OPTIMIZED) =====
        async function fetchLembaga(f){const ck=`lembaga_${JSON.stringify(f)}`,cd=cache.get(ck,300000);if(cd)return cd;let all=[],from=0;const CHUNK=1000;while(true){let q=supabaseClient.from('lembaga').select('kecamatan_id,jenis_lembaga');if(f.kecamatan_id)q=q.eq('kecamatan_id',f.kecamatan_id);if(f.jenis_lembaga)q=q.eq('jenis_lembaga',f.jenis_lembaga);const{data}=await q.range(from,from+CHUNK-1);all=all.concat(data||[]);if(!data||data.length<CHUNK)break;from+=CHUNK}cache.set(ck,all);return all}

        // ===== DONUT CHART =====
        let dc=null;
        function renderDonut(arr){const ctx=document.getElementById('donutChart').getContext('2d'),top=arr.slice(0,10),rest=arr.slice(10);let lbs=top.map(k=>k.nama),vls=top.map(k=>k.total);const ot=rest.reduce((s,k)=>s+k.total,0);if(ot>0){lbs.push('Lainnya');vls.push(ot)}const g=vls.reduce((a,b)=>a+b,0),clrs=['#0a2e1a','#2e7d32','#4CAF50','#66BB6A','#81C784','#a5d6a7','#c8e6c9','#b8860b','#DAA520','#FFD700','#7b1fa2'];if(dc)dc.destroy();dc=new Chart(ctx,{type:'doughnut',data:{labels:lbs,datasets:[{data:g===0?[1]:vls,backgroundColor:g===0?['#e8ecf1']:clrs.slice(0,lbs.length),borderColor:'#fff',borderWidth:3,hoverOffset:10,spacing:2}]},options:{responsive:true,maintainAspectRatio:true,cutout:'70%',plugins:{legend:{display:false},tooltip:{enabled:g>0,backgroundColor:'rgba(255,255,255,.95)',titleColor:'#0a2e1a',bodyColor:'#333',padding:12,cornerRadius:12,callbacks:{label:function(c){const p=g?((c.raw/g)*100).toFixed(1):0;return c.label+': '+c.raw+' ('+p+'%)'}}}},animation:{duration:1000,easing:'easeOutQuart'}}});document.getElementById('donutTotal').textContent=g}

        // ===== RENDER KEC LIST =====
        function renderList(arr){const l=document.getElementById('kecList');if(!arr||!arr.length){l.innerHTML='<div class="empty-note">📭 Belum ada data</div>';return}l.innerHTML=arr.map((k,i)=>{const t=k.total,pLPQ=t?(k.LPQ/t)*100:0,pMDT=t?(k.MDT/t)*100:0,pPP=t?(k.PONPES/t)*100:0;return`<div class="kec-item${t===0?' empty':''}"><div class="kec-row-head"><div class="kec-row-name"><span class="kec-row-rank">${i+1}</span>🏢 ${k.nama}</div><div class="kec-total-badge">${t}</div></div><div class="kec-pills"><span class="pill lpq">📘 LPQ ${k.LPQ}</span><span class="pill mdt">📗 MDT ${k.MDT}</span><span class="pill ponpes">📕 PONPES ${k.PONPES}</span></div><div class="kec-bar"><div class="kec-bar-seg lpq" style="width:${pLPQ}%;"></div><div class="kec-bar-seg mdt" style="width:${pMDT}%;"></div><div class="kec-bar-seg ponpes" style="width:${pPP}%;"></div>${t===0?'<div class="kec-bar-seg empty" style="width:100%;"></div>':''}</div></div>`}).join('')}

        // ===== LOAD DATA =====
        async function loadData(){const l=document.getElementById('kecList');l.innerHTML='<div class="spinner"></div>';try{const f=getRoleFilter();if(f.restrict){l.innerHTML='<div class="empty-note">🔒 Akses ditolak</div>';return}let kq=supabaseClient.from('master_kecamatan').select('id,nama').order('nama');if(f.kecamatan_id)kq=kq.eq('id',f.kecamatan_id);const{data:kl}=await kq,lm=await fetchLembaga(f),cnt={};(kl||[]).forEach(k=>{cnt[k.id]={nama:k.nama,LPQ:0,MDT:0,PONPES:0,total:0}});lm.forEach(r=>{const j=r.jenis_lembaga;if(r.kecamatan_id&&cnt[r.kecamatan_id]&&(j==='LPQ'||j==='MDT'||j==='PONPES')){cnt[r.kecamatan_id][j]++;cnt[r.kecamatan_id].total++}});const arr=Object.values(cnt).sort((a,b)=>b.total-a.total||a.nama.localeCompare(b.nama));renderDonut(arr);renderList(arr);const g=arr.reduce((s,k)=>s+k.total,0);document.getElementById('totalKec').textContent=arr.length;document.getElementById('avgLembaga').textContent=arr.length?(g/arr.length).toFixed(1):'0';document.getElementById('topKec').textContent=arr.length&&arr[0].total>0?arr[0].nama:'-';document.getElementById('totalKecStat').textContent=arr.length;document.getElementById('totalLembagaStat').textContent=g;document.getElementById('topKecStat').textContent=arr.length&&arr[0].total>0?arr[0].nama:'-';ts()}catch(e){console.error(e);l.innerHTML=`<div class="empty-note" style="color:#f44336;">Gagal: ${e.message}</div>`}}

        function refreshData(){cache.clear();showToast('Memperbarui...','info');loadData()}

        document.addEventListener('DOMContentLoaded',async()=>{if(!await checkAuth())return;await loadData();supabaseClient.from('pendidik').select('*',{count:'exact',head:true}).eq('status_aktif',true).then(({count})=>document.getElementById('navPendidikCount').textContent=count||0)});

        window.showToast=showToast;window.refreshData=refreshData;window.getUser=getUser;
    </script>
</body>
</html>
