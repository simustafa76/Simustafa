    if(!cd) App.cache.set('kec_options',kecs);
    const kOpts=kecs.map(k=>`<option value="${k.id}" ${k.id===l.kecamatan_id?'selected':''}>${k.nama}</option>`).join('');
    $('modalContainer').innerHTML=`<div class="modal-overlay active" id="pengaturanModal"><div class="modal-container" style="max-width:550px;">
      <div class="modal-header"><h2><i class="fas fa-building"></i> Edit Profil</h2><button class="close-btn" data-close><i class="fas fa-times"></i></button></div>
      <div class="modal-body">
        <div class="form-group"><label>Nama <span style="color:red;">*</span></label><input type="text" id="lNama" value="${l.nama||''}"></div>
        <div class="form-group"><label>Jenis</label><select id="lJenis"><option value="LPQ" ${l.jenis_lembaga==='LPQ'?'selected':''}>LPQ</option><option value="MDT" ${l.jenis_lembaga==='MDT'?'selected':''}>MDT</option><option value="PONPES" ${l.jenis_lembaga==='PONPES'?'selected':''}>PONPES</option></select></div>
        <div class="form-row">
          <div class="form-group"><label>NSLP</label><input type="text" id="lNslp" value="${l.nslp||''}"></div>
          <div class="form-group"><label>Pimpinan</label><input type="text" id="lPimpinan" value="${l.pimpinan||''}"></div>
        </div>
        <div class="form-group"><label>Alamat</label><textarea id="lAlamat" rows="2">${l.alamat||''}</textarea></div>
        <div class="form-row">
          <div class="form-group"><label>Kecamatan</label><select id="lKec"><option value="">-- Pilih --</option>${kOpts}</select></div>
          <div class="form-group"><label>Desa</label><select id="lDesa"><option value="">-- Pilih --</option></select></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>No. HP</label><input type="text" id="lHp" value="${l.no_hp||''}"></div>
          <div class="form-group"><label>Email</label><input type="email" id="lEmail" value="${l.email||''}"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Kabupaten</label><input type="text" id="lKab" value="${l.kabupaten||'Tegal'}"></div>
          <div class="form-group"><label>Provinsi</label><input type="text" id="lProv" value="${l.provinsi||'Jawa Tengah'}"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" data-close>Batal</button>
        <button class="btn btn-success" id="btnSaveLembaga"><i class="fas fa-save"></i> Simpan</button>
      </div>
    </div></div>`;
    document.querySelectorAll('#pengaturanModal [data-close]').forEach(b=>b.addEventListener('click',()=>$('pengaturanModal').remove()));
    $('lKec').addEventListener('change',e=>this._loadDesaModal(e.target.value));
    if(l.kecamatan_id) await this._loadDesaModal(l.kecamatan_id,l.desa_id);
    $('btnSaveLembaga').addEventListener('click',()=>this._saveLembaga());
    this.state.savingLembaga=false;
  },
  async _loadDesaModal(kid,preselect){
    const s=$('lDesa');if(!s) return;
    s.innerHTML='<option value="">-- Pilih --</option>';
    if(!kid) return;
    const ck='desa_'+kid,c=App.cache.get(ck,3600000);
    let d=c;
    if(!c){d=(await supabaseClient.from('master_kelurahan').select('id,nama').eq('kecamatan_id',kid).order('nama')).data||[];App.cache.set(ck,d);}
    d.forEach(i=>s.innerHTML+=`<option value="${i.id}" ${i.id===preselect?'selected':''}>${i.nama}</option>`);
  },
  async _saveLembaga(){
    if(this.state.savingLembaga){showToast('Sedang memproses...','warning');return;}
    const nama=$('lNama').value.trim();
    if(!nama){showToast('Nama wajib!','error');return;}
    const btn=$('btnSaveLembaga');this.state.savingLembaga=true;
    btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
    const kid=$('lKec').value,did=$('lDesa').value;
    let kn='',dn='';
    if(kid){kn=(await supabaseClient.from('master_kecamatan').select('nama').eq('id',kid).single()).data?.nama||'';}
    if(did){dn=(await supabaseClient.from('master_kelurahan').select('nama').eq('id',did).single()).data?.nama||'';}
    const d={
      nama,jenis_lembaga:$('lJenis').value,
      nslp:$('lNslp').value.trim(),pimpinan:$('lPimpinan').value.trim(),
      alamat:$('lAlamat').value.trim(),
      kecamatan_id:kid||null,desa_id:did||null,kecamatan:kn,desa:dn,
      kabupaten:$('lKab').value.trim()||'Tegal',provinsi:$('lProv').value.trim()||'Jawa Tengah',
      no_hp:$('lHp').value.trim(),email:$('lEmail').value.trim(),
      updated_at:new Date().toISOString()
    };
    try{
      const {error}=await supabaseClient.from('lembaga').update(d).eq('id',App.user.lembaga_id);
      if(error) throw error;
      App.cache.clear();
      showToast('Profil diperbarui!','success');
      $('pengaturanModal').remove();
      await this.refreshLembaga();
    }catch(e){showToast('Gagal: '+e.message,'error');}
    finally{this.state.savingLembaga=false;btn.disabled=false;btn.innerHTML='<i class="fas fa-save"></i> Simpan';}
  },
  async exportData(){
    try{
      showToast('Memuat modul Excel...','info');
      await loadXLSX();
      const {data}=await supabaseClient.from('pendidik').select('*').eq('lembaga_id',App.user.lembaga_id).order('nama_lengkap');
      if(!data||!data.length){showToast('Tidak ada data','warning');return;}
      const h=['NIK','Nama','Tempat Lahir','Tanggal Lahir','JK','Status Kawin','Ibu Kandung','Pendidikan','Alamat','No HP','Email','Rek Bupati','Bank Bupati','Pemilik Bupati','Rek Gubernur','Bank Gubernur','Pemilik Gubernur','TMT','Lama Mengabdi','Jenis','Status','Verifikasi'];
      const rows=data.map(i=>[i.nik,i.nama_lengkap,i.tempat_lahir,i.tanggal_lahir,i.jenis_kelamin,i.status_perkawinan,i.ibu_kandung,i.pendidikan_terakhir,i.alamat,i.no_hp,i.email,i.nomor_rekening_bupati,i.nama_bank_bupati,i.pemilik_rekening_bupati,i.nomor_rekening_gubernur,i.nama_bank_gubernur,i.pemilik_rekening_gubernur,i.tmt_mengajar,i.lama_mengabdi,i.jenis_lembaga||'LPQ',i.status_aktif?'Aktif':'Tidak Aktif',i.status_verifikasi||'Draft']);
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([h,...rows]),'Pendidik');
      XLSX.writeFile(wb,`data_pendidik_${new Date().toISOString().split('T')[0]}.xlsx`);
      showToast(`Export ${data.length} data`,'success');
    }catch(e){showToast('Gagal: '+e.message,'error');}
  },
  async backup(){
    const btn=$('btnBackup');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Backup...';
    try{
      const tables=['pendidik','bantuan'];
      const bd={lembaga_id:App.user.lembaga_id,data:{}};
      for(const t of tables){
        const {data}=await supabaseClient.from(t).select('*').eq('lembaga_id',App.user.lembaga_id);
        bd.data[t]=data||[];
      }
      bd.tanggal=new Date().toISOString();
      bd.total_pendidik=bd.data.pendidik?.length||0;
      bd.total_bantuan=bd.data.bantuan?.length||0;
      const json=JSON.stringify(bd,null,2);
      const blob=new Blob([json],{type:'application/json'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download=`backup_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      st('lastBackup',new Date().toLocaleString('id-ID'));
      showToast(`Backup: ${bd.total_pendidik} pendidik, ${bd.total_bantuan} bantuan`,'success');
    }catch(e){showToast('Gagal: '+e.message,'error');}
    finally{btn.disabled=false;btn.innerHTML='<i class="fas fa-download"></i> Backup';}
  }
};

/* ====================================================================
   INIT
   ==================================================================== */
document.addEventListener('DOMContentLoaded',async ()=>{
  if(!await checkAuth()) return;
  updateDate();
  window.addEventListener('hashchange',navigate);
  navigate();
  setInterval(updateDate,60000);
  window.addEventListener('resize',()=>{
    if(window.innerWidth>992){
      $('sidebar').classList.remove('open');
      $('sidebarOverlay').classList.remove('active');
    }
  });
});
</script>
