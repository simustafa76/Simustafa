<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=yes">
<title>SI-MUSTAFA - Operator Lembaga</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="js/supabase-client.js"></script>
<style>
:root{--p:#006400;--pl:#4CAF50;--pd:#0a2e1a;--g:#FFD700;--gd:#DAA520;--s:#4CAF50;--w:#FF9800;--d:#f44336;--i:#2196F3;--bg:#f0f4f0;--cs:0 4px 20px rgba(0,0,0,.08);--sw:250px;--hh:64px}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{background:var(--bg);min-height:100vh;display:flex}
.sidebar{width:var(--sw);height:100vh;position:fixed;top:0;left:0;background:linear-gradient(180deg,#0a2e1a 0%,#1a5a3a 100%);color:#fff;z-index:1000;transition:all .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
.sidebar.collapsed{transform:translateX(-100%)}
.sidebar::-webkit-scrollbar{width:4px}.sidebar::-webkit-scrollbar-track{background:transparent}.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px}
.sidebar-brand{padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08);min-height:var(--hh);flex-shrink:0}
.sidebar-brand img{width:36px;height:36px;border-radius:50%;object-fit:contain;background:rgba(255,255,255,.1);padding:4px;flex-shrink:0}
.sidebar-brand .brand-text{display:flex;flex-direction:column;line-height:1.2}
.sidebar-brand .brand-text h1{font-size:1rem;font-weight:700;color:#fff;letter-spacing:.5px}
.sidebar-brand .brand-text h1 span{color:var(--g)}
.sidebar-brand .brand-text small{font-size:.55rem;opacity:.7;font-weight:300}
.sidebar-menu{flex:1;padding:12px 0;list-style:none}
.sidebar-menu .menu-label{padding:8px 20px;font-size:.6rem;text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,255,255,.35);font-weight:600}
.sidebar-menu .menu-item{display:flex;align-items:center;gap:14px;padding:10px 20px;color:rgba(255,255,255,.7);text-decoration:none;font-size:.85rem;font-weight:500;transition:all .25s ease;border-left:3px solid transparent;cursor:pointer}
.sidebar-menu .menu-item:hover{background:rgba(255,255,255,.08);color:#fff}
.sidebar-menu .menu-item.active{background:rgba(255,255,255,.1);color:var(--g);border-left-color:var(--g)}
.sidebar-menu .menu-item i{width:20px;font-size:1.1rem;text-align:center;flex-shrink:0}
.sidebar-footer{padding:12px 20px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px;flex-shrink:0}
.sidebar-footer .avatar{width:36px;height:36px;border-radius:50%;background:var(--g);color:var(--pd);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.sidebar-footer .user-info{flex:1;min-width:0}
.sidebar-footer .user-info .name{font-size:.8rem;font-weight:600;color:#fff}
.sidebar-footer .user-info .role{font-size:.6rem;opacity:.6}
.sidebar-footer .logout-btn{background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer;font-size:1rem;padding:4px 8px;transition:.2s;border-radius:6px}
.sidebar-footer .logout-btn:hover{color:#ff6b6b;background:rgba(255,0,0,.1)}
.sidebar-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:999}.sidebar-overlay.active{display:block}
.main-content{margin-left:var(--sw);flex:1;min-height:100vh;transition:margin-left .3s ease;display:flex;flex-direction:column;padding:20px 40px 40px}
.main-content.expanded{margin-left:0}
.header{background:#fff;padding:0 40px;height:var(--hh);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e8ecf1;position:sticky;top:0;z-index:100;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.header-left{display:flex;align-items:center;gap:16px}
.header-left .sidebar-toggle{background:none;border:none;font-size:1.3rem;color:var(--pd);cursor:pointer;padding:4px 8px;border-radius:6px;transition:.2s}
.header-left .sidebar-toggle:hover{background:var(--bg);color:var(--p)}
.header-left .page-title h1{font-size:1.1rem;font-weight:700;color:var(--pd)}
.header-left .page-title p{font-size:.7rem;color:#888}
.header-right{display:flex;align-items:center;gap:16px}
.header-date{font-size:.75rem;color:#888}
.header-right .role-badge{background:var(--p);color:#fff;padding:4px 14px;border-radius:20px;font-size:.65rem;font-weight:600}
.header-right .role-scope{font-size:.6rem;color:#888}
.header-user{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 10px;border-radius:8px;transition:.2s}
.header-user:hover{background:var(--bg)}
.header-user .avatar{width:30px;height:30px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem}
.header-user .user-name{font-size:.8rem;font-weight:600;color:var(--pd)}
.welcome-section{background:linear-gradient(135deg,#0a2e1a 0%,#1a5a3a 50%,#2e7d32 100%);border-radius:14px;padding:24px 36px;margin-bottom:24px;color:#fff;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;box-shadow:0 8px 32px rgba(0,100,0,.3)}
.welcome-section .welcome-text h2{font-size:1.3rem;font-weight:700}
.welcome-section .welcome-text h2 span{color:var(--g)}
.welcome-section .welcome-text p{font-size:.85rem;opacity:.85;margin-top:2px}
.welcome-section .welcome-text p i{margin-right:6px;color:var(--g)}
.welcome-section .welcome-badge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:8px 20px;font-size:.75rem;font-weight:500;display:flex;align-items:center;gap:8px}
.stat-mini{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.stat-mini .stat-item{font-size:.85rem;color:#555;background:#fff;padding:10px 20px;border-radius:10px;box-shadow:var(--cs);border-left:3px solid var(--p)}
.stat-mini .stat-item strong{color:var(--p);font-size:1.1rem}
.stat-mini .stat-item:nth-child(2){border-left-color:var(--s)}.stat-mini .stat-item:nth-child(3){border-left-color:var(--d)}.stat-mini .stat-item:nth-child(4){border-left-color:var(--w)}.stat-mini .stat-item:nth-child(5){border-left-color:#ff9800}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat-grid .stat-card{background:#fff;padding:14px 16px;border-radius:12px;text-align:center;box-shadow:var(--cs);border-top:3px solid var(--p)}
.stat-grid .stat-card:nth-child(2){border-top-color:var(--s)}.stat-grid .stat-card:nth-child(3){border-top-color:var(--w)}.stat-grid .stat-card:nth-child(4){border-top-color:#7b1fa2}
.stat-grid .stat-card .label{font-size:.65rem;color:#888;text-transform:uppercase;letter-spacing:.5px}
.stat-grid .stat-card .value{font-size:1.5rem;font-weight:700;color:var(--pd)}
.stat-grid .stat-card .value.green{color:var(--s)}.stat-grid .stat-card .value.orange{color:var(--w)}.stat-grid .stat-card .value.blue{color:#1976d2}.stat-grid .stat-card .value.purple{color:#7b1fa2}
.filter-section{display:flex;flex-wrap:wrap;gap:12px;background:linear-gradient(135deg,#fff 0%,#f5faf5 100%);padding:16px 24px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.04);border:1px solid rgba(0,100,0,.08);margin-bottom:16px;align-items:flex-end}
.filter-section .filter-item{flex:1;min-width:150px}
.filter-section .filter-item label{display:block;font-size:.7rem;color:#888;margin-bottom:2px;font-weight:600}
.filter-section .filter-item input,.filter-section .filter-item select{width:100%;padding:8px 14px;border:2px solid #e0e0e0;border-radius:8px;font-size:.85rem;background:#fff;transition:.2s}
.filter-section .filter-item input:focus,.filter-section .filter-item select:focus{border-color:var(--p);outline:none;box-shadow:0 0 0 3px rgba(0,100,0,.08)}
.filter-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filter-actions .btn{white-space:nowrap}
.card{background:#fff;border-radius:14px;padding:20px 24px;box-shadow:var(--cs)}
.card .card-title{font-size:.85rem;font-weight:600;color:var(--pd)}
.card .card-title i{margin-right:8px;color:var(--p)}
.table-responsive{overflow-x:auto}
.table-responsive table{width:100%;font-size:.85rem;border-collapse:collapse}
.table-responsive table th{padding:10px 12px;text-align:left;background:#eaf0ea;color:#1b5e20;font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #c8e6c9;position:sticky;top:0}
.table-responsive table tbody tr:nth-child(even){background:#f6faf6}
.table-responsive table tbody tr:nth-child(odd){background:#fff}
.table-responsive table tbody tr:hover{background:#e8f5e9;cursor:pointer;transition:background .2s}
.table-responsive table td{padding:10px 12px;border-bottom:1px solid #f0f4f0;vertical-align:middle}
.badge{padding:3px 14px;border-radius:20px;font-size:.7rem;font-weight:600;display:inline-block}
.badge.active,.badge.verified,.badge.disetujui,.badge.cair{background:#e8f5e9;color:#2e7d32}
.badge.inactive,.badge.rejected,.badge.ditolak,.badge.batal{background:#ffebee;color:#c62828}
.badge.pending,.badge.diajukan,.badge.pengajuan_baru,.badge.proses_pencairan{background:#fff3e0;color:#e65100}
.badge.draft,.badge.proses_verifikasi,.badge.disetujui2{background:#e3f2fd;color:#0d47a1}
.badge.penerima_sebelumnya{background:#fce4ec;color:#880e4f}
.badge.berlaku{background:#e8f5e9;color:#1b5e20}
.badge-luar-daerah{background:#ff9800;color:#fff;font-size:.55rem;padding:2px 8px;border-radius:12px;display:inline-flex;align-items:center;gap:4px;margin-left:4px}
.badge-lokal{background:#e8f5e9;color:#2e7d32;font-size:.55rem;padding:2px 8px;border-radius:12px;display:inline-flex;align-items:center;gap:4px;margin-left:4px}
.badge-jenis-antar_lembaga{background:#e3f2fd;color:#0d47a1}
.badge-jenis-antar_kecamatan{background:#f3e5f5;color:#4a148c}
.badge-jenis-pensiun{background:#fff3e0;color:#e65100}
.badge-jenis-berhenti{background:#ffebee;color:#c62828}
.badge-jenis-meninggal{background:#212121;color:#fff}
.badge-jenis-lpq{background:#e3f2fd;color:#0d47a1;font-size:.6rem;padding:1px 8px;border-radius:10px;margin-left:6px;display:inline-block}
.badge-jenis-mdt{background:#f3e5f5;color:#4a148c;font-size:.6rem;padding:1px 8px;border-radius:10px;margin-left:6px;display:inline-block}
.badge-jenis-ponpes{background:#fff3e0;color:#e65100;font-size:.6rem;padding:1px 8px;border-radius:10px;margin-left:6px;display:inline-block}
.btn{padding:6px 14px;border:none;border-radius:8px;font-size:.75rem;font-weight:600;cursor:pointer;transition:all .2s ease;display:inline-flex;align-items:center;gap:6px}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-outline{background:transparent;color:var(--p);border:1.5px solid var(--p)}.btn-outline:hover{background:var(--p);color:#fff}
.btn-primary{background:var(--p);color:#fff}.btn-primary:hover{background:var(--pl)}
.btn-success{background:var(--s);color:#fff}.btn-success:hover{background:#43a047}
.btn-danger{background:var(--d);color:#fff}.btn-danger:hover{background:#d32f2f}
.btn-warning{background:var(--w);color:#fff}.btn-warning:hover{background:#f57c00}
.btn-info{background:var(--i);color:#fff}.btn-info:hover{background:#1976d2}
.btn-sm{padding:4px 10px;font-size:.7rem}
.btn-xs{padding:2px 8px;font-size:.65rem;border-radius:6px}
.btn-large{padding:12px 24px;font-size:.9rem;border-radius:12px}
.action-buttons{display:flex;gap:4px;flex-wrap:wrap}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);padding:12px 24px;border-radius:12px;color:#fff;font-weight:500;font-size:.85rem;box-shadow:0 8px 30px rgba(0,0,0,.2);z-index:9999;opacity:0;transition:all .3s ease;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast-success{background:var(--s)}.toast-error{background:var(--d)}.toast-info{background:var(--p)}.toast-warning{background:var(--w)}
.spinner{width:32px;height:32px;border:3px solid #f0f2f5;border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
.spinner-sm{display:inline-block;width:16px;height:16px;border:2px solid #f0f2f5;border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:2000;justify-content:center;align-items:center;padding:20px}
.modal-overlay.active{display:flex}
.modal-container{background:#fff;border-radius:16px;padding:28px 30px;max-width:800px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid #f0f2f5}
.modal-header h2{font-size:1.2rem;color:var(--p);font-weight:700}
.modal-header .close-btn{background:none;border:none;font-size:1.5rem;color:#888;cursor:pointer}
.modal-body .form-group{margin-bottom:14px}
.modal-body .form-group label{display:block;font-size:.75rem;font-weight:600;color:#555;margin-bottom:2px}
.modal-body .form-group input,.modal-body .form-group select,.modal-body .form-group textarea{width:100%;padding:8px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:.9rem;background:#fafafa;transition:.2s}
.modal-body .form-group input:focus,.modal-body .form-group select:focus,.modal-body .form-group textarea:focus{border-color:var(--p);outline:none;background:#fff}
.modal-body .form-group textarea{resize:vertical;min-height:60px}
.modal-body .form-group input:disabled,.modal-body .form-group select:disabled{background:#f5f5f5;color:#666;cursor:not-allowed}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid #f0f2f5}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group.full-width{grid-column:1/-1}
.section-title{font-size:.85rem;font-weight:700;color:var(--p);margin:16px 0 12px;padding-bottom:6px;border-bottom:2px solid #f0f2f5}
.rekening-box{background:#f8f9fa;padding:12px;border-radius:8px;border:1px solid #e0e0e0;margin-bottom:8px}
.rekening-box .rekening-title{font-size:.7rem;font-weight:700;color:var(--p);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.lembaga-readonly{background:#f5f5f5!important;color:#666!important;cursor:not-allowed!important;border-color:#e8e8e8!important}
.lama-mengabdi-display{background:#f5f5f5;padding:8px 12px;border-radius:8px;border:2px solid #e8e8e8;color:#666;font-size:.9rem;min-height:40px;display:flex;align-items:center}
.upload-preview{margin-top:6px;padding:6px 12px;background:#f8faf8;border-radius:6px;display:none;align-items:center;gap:8px;border:1px solid #e8e8e8}
.upload-preview.visible{display:flex}
.upload-preview .file-name{font-size:.8rem;font-weight:500;color:#333;flex:1}
.info-box{background:#e3f2fd;border-left:4px solid var(--i);padding:12px 16px;border-radius:8px;margin-bottom:16px}
.info-box i{color:var(--i);margin-right:8px}
.info-box.warning{background:#fff3e0;border-left-color:var(--w)}
.info-box.success{background:#e8f5e9;border-left-color:var(--s)}
.info-box.error{background:#ffebee;border-left-color:var(--d)}
.wilayah-info{font-size:.7rem;color:#888;margin-top:2px}
.info-banner{background:#e3f2fd;border-left:4px solid #0d47a1;padding:12px 16px;border-radius:8px;margin-bottom:16px;display:flex;align-items:center;gap:12px;font-size:.85rem;color:#0d47a1}
.info-banner i{font-size:1.2rem}
.info-banner .highlight{font-weight:700;color:#0a2e1a}
.status-badge-large{padding:8px 20px;border-radius:20px;font-size:.85rem;font-weight:700;display:inline-block;margin-bottom:12px}
.searchable-select-wrapper{position:relative;width:100%}
.searchable-select-wrapper input[type="text"]{width:100%;padding:8px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:.9rem;background:#fafafa;transition:.2s;cursor:pointer}
.searchable-select-wrapper input[type="text"]:focus{border-color:var(--p);outline:none;background:#fff}
.searchable-select-wrapper .dropdown-list{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:2px solid #e0e0e0;border-top:none;border-radius:0 0 8px 8px;max-height:200px;overflow-y:auto;z-index:1000;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.searchable-select-wrapper .dropdown-list.open{display:block}
.searchable-select-wrapper .dropdown-list .option-item{padding:8px 12px;cursor:pointer;font-size:.85rem;border-bottom:1px solid #f0f2f5;transition:.15s}
.searchable-select-wrapper .dropdown-list .option-item:hover{background:#e8f5e9}
.searchable-select-wrapper .dropdown-list .option-item.selected{background:#c8e6c9;font-weight:600}
.searchable-select-wrapper .dropdown-list .option-item .sub-text{font-size:.7rem;color:#888;display:block}
.searchable-select-wrapper .dropdown-list .no-result{padding:12px;text-align:center;color:#999;font-size:.85rem}
.selected-info{background:#f8faf8;padding:10px 14px;border-radius:8px;border-left:4px solid var(--p);margin-bottom:12px;display:none}
.selected-info .info-label{font-size:.7rem;color:#888}
.selected-info .info-value{font-weight:600;font-size:.95rem}
.selected-info .info-sub{font-size:.8rem;color:#666}
.hidden-field{display:none}.hidden-field.visible{display:block}
mark.search-highlight{background:#ffeb3b;padding:0 2px;border-radius:2px;font-weight:600}
.search-input-wrapper{display:flex;gap:8px;align-items:center;width:100%}
.search-input-wrapper input{flex:1}
.search-info{display:flex;align-items:center;gap:6px;font-size:.75rem;color:#666;white-space:nowrap;flex-shrink:0}
.search-info .search-count{font-weight:600;color:var(--p);font-size:.7rem}
.search-info .btn-clear-search{background:none;border:none;color:#999;cursor:pointer;font-size:.9rem;padding:2px 6px;border-radius:4px;transition:.2s}
.search-info .btn-clear-search:hover{background:#f0f0f0;color:var(--d)}
.setting-section{background:#fff;border-radius:14px;padding:20px 24px;box-shadow:var(--cs);margin-bottom:16px;border:1px solid rgba(0,100,0,.06)}
.setting-section .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid #f0f2f5;flex-wrap:wrap;gap:8px}
.setting-section .section-title{font-size:.95rem;font-weight:600;color:var(--p);margin:0;padding:0;border:none}
.setting-section .section-title i{margin-right:10px;color:var(--pl)}
.setting-section .section-desc{font-size:.8rem;color:#888;margin-top:2px}
.setting-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f5f6f8;gap:12px}
.setting-item:last-child{border-bottom:none}
.setting-item .item-label{font-size:.85rem;color:#333;flex:1;min-width:150px}
.setting-item .item-label small{display:block;font-size:.7rem;color:#888;font-weight:400}
.setting-item .item-control{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.setting-item .item-control input{padding:6px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:.85rem;background:#fff;transition:.2s;min-width:180px}
.setting-item .item-control input:focus{border-color:var(--p);outline:none;box-shadow:0 0 0 3px rgba(0,100,0,.08)}
.setting-item .item-control input[readonly]{background:#f5f5f5;color:#666;cursor:not-allowed}
.lembaga-info-box{background:#f8faf8;border-radius:10px;padding:16px 20px;margin-bottom:12px;border-left:4px solid var(--p)}
.lembaga-info-box .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.lembaga-info-box .info-item .label{font-size:.65rem;color:#888;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.lembaga-info-box .info-item .value{font-size:.9rem;font-weight:600;color:var(--pd)}
.backup-info{margin-top:12px;padding:12px 16px;background:#fff3e0;border-radius:10px;font-size:.8rem;color:#856404;border-left:3px solid var(--w)}
.backup-info i{margin-right:8px}
.page-loading{padding:60px 20px;text-align:center;color:#999}
@media (max-width:992px){
.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}
.sidebar-overlay.active{display:block}
.main-content{margin-left:0;padding:16px 20px 30px}
.header{padding:0 20px}
.header-left .page-title p{display:none}

</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <img src="assets/logo-kemenag.png" alt="Logo" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Cpolygon points=%2250,5 61,35 93,35 68,53 79,83 50,65 21,83 32,53 7,35 39,35%22 fill=%22%23FFD700%22/%3E%3C/svg%3E'">
    <div class="brand-text"><h1>SI-<span>MUSTAFA</span></h1><small>Kemenag Kab. Tegal</small></div>
  </div>
  <ul class="sidebar-menu">
    <li class="menu-label">Menu Operator</li>
    <li><a class="menu-item" data-route="#/dashboard" href="#/dashboard"><i class="fas fa-chart-pie"></i>Dashboard</a></li>
    <li><a class="menu-item" data-route="#/pendidik" href="#/pendidik"><i class="fas fa-user-graduate"></i>Pendidik</a></li>
    <li><a class="menu-item" data-route="#/bantuan" href="#/bantuan"><i class="fas fa-hand-holding-heart"></i>Bantuan</a></li>
    <li><a class="menu-item" data-route="#/mutasi" href="#/mutasi"><i class="fas fa-exchange-alt"></i>Mutasi</a></li>
    <li><a class="menu-item" data-route="#/pengaturan" href="#/pengaturan"><i class="fas fa-cog"></i>Pengaturan</a></li>
  </ul>
  <div class="sidebar-footer">
    <div class="avatar" id="userAvatar">O</div>
    <div class="user-info"><div class="name" id="userName">Operator</div><div class="role" id="userRole">Operator Lembaga</div></div>
    <button class="logout-btn" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i></button>
  </div>
</aside>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<main class="main-content" id="mainContent">
  <header class="header">
    <div class="header-left">
      <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
      <div class="page-title"><h1 id="pageTitle">Dashboard Operator</h1><p id="pageSubtitle">Kelola data pendidik di lembaga Anda</p></div>
    </div>
    <div class="header-right">
      <span class="header-date" id="currentDate"></span>
      <span class="role-badge" id="headerRoleBadge">Operator</span>
      <span class="role-scope" id="headerScope"></span>
      <div class="header-user"><div class="avatar" id="userAvatarSmall">O</div><span class="user-name" id="userNameSmall">Operator</span></div>
    </div>
  </header>
  <div id="viewContainer"><div class="page-loading"><div class="spinner"></div></div></div>
</main>

<div class="toast" id="toast"></div>

<script>
/* ====================================================================
   SI-MUSTAFA OPERATOR — SPA
   Routes: #/dashboard #/pendidik #/bantuan #/mutasi #/pengaturan
   ==================================================================== */

/* ---------- GLOBAL STATE ---------- */
const App = {
  user: null,
  lembagaInfo: null,
  cache: {
    _s:{},
    get(k,t=600000){const e=this._s[k];if(!e)return null;if(Date.now()-e.t>t){delete this._s[k];return null}return e.d},
    set(k,d){this._s[k]={d,t:Date.now()}},
    clear(){this._s={}}
  },
  currentView: null
};

const CLOUDINARY_CLOUD_NAME = 'ddrbmte6';
const CLOUDINARY_UPLOAD_PRESET = 'simustafa_preset';
const MAX_FILE_SIZE = 300;

/* ---------- CORE UTILS ---------- */
const $ = id => document.getElementById(id);
const st = (id,v) => { const e=$(id); if(e) e.textContent=v; };
function showToast(m,t='info'){
  const e=$('toast'); if(!e){console.log(m);return;}
  e.textContent=m; e.className=`toast toast-${t}`;
  void e.offsetWidth; e.classList.add('show');
  clearTimeout(e._to); e._to=setTimeout(()=>e.classList.remove('show'),4000);
}
function sanitizeUUID(v){
  if(!v||v===''||v==='null'||v==='undefined') return null;
  const r=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  return r.test(String(v))?v:null;
}
/* Helper deteksi Kabupaten Tegal (case-insensitive, prefix-agnostic) */
function isKabTegal(kab){
  if(!kab) return false;
  return String(kab).toLowerCase().includes('tegal');
}
function toggleSidebar(){
  $('sidebar').classList.toggle('open');
  $('sidebarOverlay').classList.toggle('active');
}
function updateDate(){
  const n=new Date();
  st('currentDate',n.toLocaleDateString('id-ID',{weekday:'long',year:'numeric',month:'long',day:'numeric'}));
}
function debounce(fn,ms){let t;return function(...a){clearTimeout(t);t=setTimeout(()=>fn.apply(this,a),ms)};}
async function loadXLSX(){
  if(window.XLSX) return window.XLSX;
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload=()=>res(window.XLSX);
    s.onerror=rej;
    document.head.appendChild(s);
  });
}

/* ---------- AUTH ---------- */
async function checkAuth(){
  try{
    const {data:{session}}=await supabaseClient.auth.getSession();
    if(!session){location.href='index.html';return false;}
    const {data:u}=await supabaseClient.from('users')
      .select('id,name,email,role,kecamatan_id,lembaga_id,active')
      .eq('id',session.user.id).single();
    if(!u||!u.active||u.role!=='operator'||!u.lembaga_id){
      await supabaseClient.auth.signOut();
      location.href='index.html'; return false;
    }
    App.user={
      id:u.id, name:u.name||session.user.email, email:session.user.email,
      role:'operator', kecamatan_id:u.kecamatan_id, lembaga_id:u.lembaga_id
    };
    const {data:ld}=await supabaseClient.from('lembaga')
      .select('*').eq('id',u.lembaga_id).single();
    App.lembagaInfo=ld||{};
    updateHeaderUI();
    return true;
  }catch(e){console.error('Auth error:',e);location.href='index.html';return false;}
}
function getUser(){return App.user;}
function updateHeaderUI(){
  const u=App.user; if(!u) return;
  st('userAvatar',u.name.charAt(0).toUpperCase());
  st('userName',u.name);
  st('userAvatarSmall',u.name.charAt(0).toUpperCase());
  st('userNameSmall',u.name);
  if(App.lembagaInfo) st('headerScope','🏫 '+(App.lembagaInfo.nama||''));
}
async function handleLogout(){
  if(!confirm('Yakin keluar?')) return;
  await supabaseClient.auth.signOut();
  App.cache.clear();
  showToast('Logout berhasil!','success');
  setTimeout(()=>location.href='index.html',1000);
}

/* ---------- ROUTER ---------- */
const ROUTES = {
  '#/dashboard':  { title:'Dashboard Operator', subtitle:'Ringkasan data lembaga Anda', view:()=>DashboardView },
  '#/pendidik':   { title:'Data Pendidik',      subtitle:'Kelola data pendidik di lembaga Anda', view:()=>PendidikView },
  '#/bantuan':    { title:'Bantuan & Insentif', subtitle:'Kelola bantuan di lembaga Anda', view:()=>BantuanView },
  '#/mutasi':     { title:'Mutasi',             subtitle:'Proses pengajuan perpindahan pendidik', view:()=>MutasiView },
  '#/pengaturan': { title:'Pengaturan',         subtitle:'Kelola profil lembaga dan akun Anda', view:()=>PengaturanView }
};

function navigate(){
  const hash = location.hash && ROUTES[location.hash] ? location.hash : '#/dashboard';
  const route = ROUTES[hash];
  if(App.currentView && App.currentView.destroy) try{App.currentView.destroy();}catch(e){}
  st('pageTitle', route.title);
  st('pageSubtitle', route.subtitle);
  document.querySelectorAll('.sidebar-menu .menu-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.route===hash);
  });
  const v = route.view();
  App.currentView = v;
  $('viewContainer').innerHTML = v.template();
  if(v.init) v.init();
}

/* ---------- SHARED HELPERS ---------- */
function welcomeHTML(){
  const u=App.user; const l=App.lembagaInfo;
  return `<div class="welcome-section">
    <div class="welcome-text"><h2>Selamat datang, <span>${u?.name||'Operator'}</span> 👋</h2>
    <p><i class="fas fa-building"></i> <span>Operator ${l?.nama||'Lembaga'}</span></p></div>
    <div class="welcome-badge"><i class="fas fa-calendar-alt"></i><span id="welcomeDate">${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</span></div>
  </div>`;
}
function tableSpinner(cols){return `<tr><td colspan="${cols}" style="text-align:center;padding:30px;"><div class="spinner"></div></td></tr>`;}
function tableEmpty(cols,msg='📭 Belum ada data'){return `<tr><td colspan="${cols}" style="text-align:center;padding:30px;color:#999;">${msg}</td></tr>`;}
function tableError(cols,msg){return `<tr><td colspan="${cols}" style="text-align:center;padding:30px;color:#f44336;">Gagal: ${msg}</td></tr>`;}
function paginationHTML(){return `<div style="display:flex;justify-content:center;align-items:center;gap:16px;padding-top:12px;border-top:1px solid #f0f2f5;margin-top:12px;">
  <button class="btn btn-outline btn-sm" id="prevPage"><i class="fas fa-chevron-left"></i></button>
  <span id="pageInfo">Halaman 1</span>
  <button class="btn btn-outline btn-sm" id="nextPage"><i class="fas fa-chevron-right"></i></button>
</div>`;}
function fmtRupiah(v){return v?(+v).toLocaleString('id-ID'):'0';}
function formatTanggal(d){if(!d)return '-';try{return new Date(d).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return d;}}
function highlightText(text,search){
  if(!search||!text) return text||'-';
  const esc=search.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp(`(${esc})`,'gi');
  const safe=String(text).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  return safe.replace(re,'<mark class="search-highlight">$1</mark>');
}

/* ====================================================================
   VIEW 1: DASHBOARD
   ==================================================================== */
const DashboardView = {
  state:{cp:1,ps:10,td:0,f:{search:'',status:'all',verifikasi:'all',domisili:'all'},searchTimeout:null},
  template(){
    return `${welcomeHTML()}
    <div class="stat-mini">
      <div class="stat-item">Total: <strong id="totalPendidik">0</strong></div>
      <div class="stat-item">Aktif: <strong id="totalAktif">0</strong></div>
      <div class="stat-item">Nonaktif: <strong id="totalNonaktif">0</strong></div>
      <div class="stat-item">Pending: <strong id="totalPending">0</strong></div>
      <div class="stat-item">🌍 Luar Kab.: <strong id="totalLuarDaerah">0</strong></div>
    </div>
    <div class="filter-section">
      <div class="filter-item" style="flex:2;"><label><i class="fas fa-search"></i> Cari</label><input type="text" id="searchInput" placeholder="Nama atau NIK..."></div>
      <div class="filter-item"><label>Status</label><select id="statusFilter"><option value="all">Semua</option><option value="active">Aktif</option><option value="inactive">Tidak Aktif</option></select></div>
      <div class="filter-item"><label>Verifikasi</label><select id="verifikasiFilter"><option value="all">Semua</option><option value="Draft">Draft</option><option value="Pending">Pending</option><option value="Diverifikasi">Diverifikasi</option><option value="Ditolak">Ditolak</option></select></div>
      <div class="filter-item"><label>Domisili</label><select id="domisiliFilter"><option value="all">Semua</option><option value="lokal">Dalam Kab. Tegal</option><option value="luar">Luar Kab. Tegal</option></select></div>
      <div class="filter-actions">
        <button class="btn btn-success" id="btnAdd"><i class="fas fa-plus"></i> Ajukan Baru</button>
        <button class="btn btn-outline" id="btnRefresh"><i class="fas fa-sync"></i> Refresh</button>
      </div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
        <div class="card-title"><i class="fas fa-list"></i>Daftar Pendidik <small id="totalData">0 data</small></div>
      </div>
      <div class="table-responsive">
        <table><thead><tr><th>No</th><th>NIK</th><th>Nama</th><th>Status</th><th>Verifikasi</th><th>Domisili</th><th>Aksi</th></tr></thead>
        <tbody id="tbody">${tableSpinner(7)}</tbody></table>
      </div>
      ${paginationHTML()}
    </div>
    <div id="modalContainer"></div>`;
  },
  init(){
    const s=this.state;
    $('searchInput').addEventListener('input',debounce(()=>this.applyFilter(),500));
    $('statusFilter').addEventListener('change',()=>this.applyFilter());
    $('verifikasiFilter').addEventListener('change',()=>this.applyFilter());
    $('domisiliFilter').addEventListener('change',()=>this.applyFilter());
    $('btnAdd').addEventListener('click',()=>DashboardModal.openAdd(this));
    $('btnRefresh').addEventListener('click',()=>{App.cache.clear();this.load();showToast('Diperbarui','info');});
    $('prevPage').addEventListener('click',()=>this.changePage(-1));
    $('nextPage').addEventListener('click',()=>this.changePage(1));
    this.load();
  },
  destroy(){
    if(this.state.searchTimeout) clearTimeout(this.state.searchTimeout);
    if(DashboardModal._close) DashboardModal.close();
  },
  applyFilter(){
    const s=this.state;
    s.f.search=$('searchInput').value.trim();
    s.f.status=$('statusFilter').value;
    s.f.verifikasi=$('verifikasiFilter').value;
    s.f.domisili=$('domisiliFilter').value;
    s.cp=1; this.load();
  },
  async load(){
    const s=this.state, u=App.user;
    if(!u?.lembaga_id) return;
    try{
      let q=supabaseClient.from('pendidik').select('*',{count:'exact'}).eq('lembaga_id',u.lembaga_id);
      if(s.f.search) q=q.or(`nik.ilike.%${s.f.search}%,nama_lengkap.ilike.%${s.f.search}%`);
      if(s.f.status==='active') q=q.eq('status_aktif',true);
      else if(s.f.status==='inactive') q=q.eq('status_aktif',false);
      if(s.f.verifikasi!=='all') q=q.eq('status_verifikasi',s.f.verifikasi);
      if(s.f.domisili==='lokal') q=q.ilike('kabupaten_pengajar','%tegal%');
      else if(s.f.domisili==='luar') q=q.not('kabupaten_pengajar','ilike','%tegal%');
      const from=(s.cp-1)*s.ps;
      const {data,count}=await q.order('nama_lengkap',{ascending:true}).range(from,from+s.ps-1);
      s.td=count||0;
      this.render(data||[]);
      this.updatePagination();
      this.loadStats();
    }catch(e){$('tbody').innerHTML=tableError(7,e.message);}
  },
  render(data){
    const s=this.state, t=$('tbody');
    st('totalData',`${s.td} data`);
    if(!data.length){t.innerHTML=tableEmpty(7,'📭 Belum ada pendidik');return;}
    const start=(s.cp-1)*s.ps;
    t.innerHTML=data.map((i,n)=>{
      const sb=i.status_aktif?'active':'inactive', stxt=i.status_aktif?'Aktif':'Tidak Aktif';
      const vmap={'Draft':'draft','Pending':'pending','Diverifikasi':'verified','Ditolak':'rejected'};
      const vb=vmap[i.status_verifikasi]||'draft', vtxt=i.status_verifikasi||'Draft';
      const kabRaw=i.kabupaten_pengajar;
      const kabDisplay=(kabRaw||'-').replace(/^(KABUPATEN|KOTA)\s+/i,'').trim()||'-';
      const dom = !kabRaw
        ? `<span style="color:#999;">-</span>`
        : (isKabTegal(kabRaw)
            ? `<span class="badge-lokal"><i class="fas fa-home"></i> ${kabDisplay}</span>`
            : `<span class="badge-luar-daerah"><i class="fas fa-map-pin"></i> ${kabDisplay}</span>`);
      const dis=i.status_verifikasi==='Diverifikasi'?'disabled':'';
      return `<tr><td>${start+n+1}</td>
        <td><code style="background:#f0f2f5;padding:2px 6px;border-radius:4px;font-size:.7rem;">${i.nik||'-'}</code></td>
        <td><strong>${i.nama_lengkap||'-'}</strong></td>
        <td><span class="badge ${sb}">${stxt}</span></td>
        <td><span class="badge ${vb}">${vtxt}</span></td>
        <td>${dom}</td>
        <td><div class="action-buttons">
          <button class="btn btn-info btn-xs" data-act="view" data-id="${i.id}"><i class="fas fa-eye"></i></button>
          <button class="btn btn-warning btn-xs" data-act="edit" data-id="${i.id}" ${dis}><i class="fas fa-edit"></i></button>
        </div></td></tr>`;
    }).join('');
    t.querySelectorAll('[data-act]').forEach(b=>{
      b.addEventListener('click',e=>{
        const id=b.dataset.id;
        if(b.dataset.act==='view') DashboardModal.openView(this,id);
        else DashboardModal.openEdit(this,id);
      });
    });
  },
  async loadStats(){
    const u=App.user; if(!u?.lembaga_id) return;
    try{
      const {data}=await supabaseClient.from('pendidik').select('status_aktif,status_verifikasi,kabupaten_pengajar').eq('lembaga_id',u.lembaga_id);
      const d=data||[];
      st('totalPendidik',d.length);
      st('totalAktif',d.filter(x=>x.status_aktif===true).length);
      st('totalNonaktif',d.filter(x=>x.status_aktif===false).length);
      st('totalPending',d.filter(x=>x.status_verifikasi==='Pending'||x.status_verifikasi==='Draft').length);
      st('totalLuarDaerah',d.filter(x=>x.kabupaten_pengajar&&!isKabTegal(x.kabupaten_pengajar)).length);
    }catch(e){console.error(e);}
  },
  updatePagination(){
    const s=this.state, tp=Math.ceil(s.td/s.ps);
    st('pageInfo',`Halaman ${s.cp} dari ${tp||1}`);
    $('prevPage').disabled=s.cp<=1;
    $('nextPage').disabled=s.cp>=tp;
  },
  changePage(d){
    const s=this.state, tp=Math.ceil(s.td/s.ps), np=s.cp+d;
    if(np<1||np>tp) return;
    s.cp=np; this.load();
  }
};

/* ---------- Dashboard Modal ---------- */
const DashboardModal = {
  _close:false,
  _state:{provincesData:[],regenciesData:[],districtsData:[],villagesData:[],provinceMap:{},regencyMap:{},districtMap:{},villageMap:{},dokUrls:{ktp:'',bupati:'',gubernur:''},editing:null,saving:false,view:null},
  _closeModal(){
    const m=$('pendidikModal'); if(m) m.remove();
    this._close=true;
  },
  _input(id){const e=$(id);return e?e.value:'';},
  _set(id,v){const e=$(id);if(e)e.value=v==null?'':v;},
  async openAdd(view){
    const u=App.user;
    if(!u?.lembaga_id){showToast('Lembaga tidak ditemukan!','error');return;}
    this._close=false; this._state.view=view;
    this._state.editing=null;
    this._state.dokUrls={ktp:'',bupati:'',gubernur:''};
    this._render('Ajukan Pendidik Baru',false);
    await this._loadProvinces();
    $('editProvinsi').value='';
    const jt=this._state.provincesData.find(p=>p.name==='Jawa Tengah');
    if(jt){$('editProvinsi').value=jt.id; await this._onProvinsiChange();}
  },
  async openView(view,id){
    this._close=false; this._state.view=view;
    const {data}=await supabaseClient.from('pendidik').select('*').eq('id',id).single();
    if(!data){showToast('Tidak ditemukan','error');return;}
    this._state.editing=data;
    this._render('Detail Pendidik',true);
    await this._loadProvinces();
    await this._fill(data);
    this._disableInputs(true);
    $('btnSave').style.display='none';
    this._showVerifyInfo(data);
  },
  async openEdit(view,id){
    this._close=false; this._state.view=view;
    const {data}=await supabaseClient.from('pendidik').select('*').eq('id',id).single();
    if(!data){showToast('Tidak ditemukan','error');return;}
    if(data.status_verifikasi==='Diverifikasi'){showToast('Data sudah diverifikasi, tidak dapat diedit!','warning');return;}
    this._state.editing=data;
    this._render('Edit Pengajuan',false);
    await this._loadProvinces();
    await this._fill(data);
    $('btnSave').innerHTML='<i class="fas fa-paper-plane"></i> Update Pengajuan';
    this._showVerifyInfo(data);
  },
  _render(title,readonly){
    const html=`<div class="modal-overlay active" id="pendidikModal"><div class="modal-container">
      <div class="modal-header"><h2 id="modalTitle">${title}</h2><button class="close-btn" id="btnCloseModal"><i class="fas fa-times"></i></button></div>
      <div class="modal-body">
        <input type="hidden" id="editId"><input type="hidden" id="editLembagaId">
        <div id="verificationInfo" style="display:none;"></div>
        <div class="section-title"><i class="fas fa-id-card"></i> Identitas</div>
        <div class="form-row">
          <div class="form-group"><label>NIK <span style="color:red;">*</span></label><input type="text" id="editNik" maxlength="16"></div>
          <div class="form-group"><label>Nama <span style="color:red;">*</span></label><input type="text" id="editNama"></div>

  _hitungLama(){
    const t=$('editTmt').value;
    if(!t){st('lamaMengabdiDisplay','0 Tahun');$('editLamaMengabdi').value='0';return;}
    const td=new Date(t),n=new Date();
    let y=n.getFullYear()-td.getFullYear();
    const m=n.getMonth()-td.getMonth();
    if(m<0||(m===0&&n.getDate()<td.getDate())) y--;
    const l=Math.max(0,y);
    st('lamaMengabdiDisplay',`${l} Tahun`);
    $('editLamaMengabdi').value=l;
  },
  async _upload(input,type){
    const file=input.files[0]; if(!file) return;
    if(file.size>10*1024*1024){showToast('File terlalu besar! Maks 10MB','error');input.value='';return;}
    showToast('Memproses file...','info');
    try{
      let up=file;
      if(file.type.startsWith('image/')) up=await this._compress(file,MAX_FILE_SIZE);
      const fd=new FormData();
      fd.append('file',up);fd.append('upload_preset',CLOUDINARY_UPLOAD_PRESET);
      const r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/upload`,{method:'POST',body:fd});
      const d=await r.json();
      if(d.error) throw new Error(d.error.message);
      this._state.dokUrls[type]=d.secure_url;
      $('dokumen'+type.charAt(0).toUpperCase()+type.slice(1)+'Preview').classList.add('visible');
      $('dokumen'+type.charAt(0).toUpperCase()+type.slice(1)+'Name').textContent=file.name;
      showToast('Berhasil upload!','success');
    }catch(e){showToast('Gagal: '+e.message,'error');input.value='';}
  },
  _compress(file,targetKB=300){
    return new Promise(res=>{
      if(file.size<=targetKB*1024){res(file);return;}
      const r=new FileReader();
      r.onload=e=>{
        const img=new Image();
        img.onload=()=>{
          let w=img.width,h=img.height;const mx=1000;
          if(w>mx||h>mx){const ra=Math.min(mx/w,mx/h);w=Math.round(w*ra);h=Math.round(h*ra);}
          const c=document.createElement('canvas');c.width=w;c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          const qs=[0.8,0.6,0.4,0.2,0.1];
          const tryQ=i=>{
            c.toBlob(b=>{
              if(!b){res(file);return;}
              const f=new File([b],file.name.replace(/\.[^.]+$/,'.jpg'),{type:'image/jpeg'});
              if(f.size<=targetKB*1024||i===qs.length-1) res(f);
              else tryQ(i+1);
            },'image/jpeg',qs[i]);
          };
          tryQ(0);
        };
        img.onerror=()=>res(file);
        img.src=e.target.result;
      };
      r.onerror=()=>res(file);
      r.readAsDataURL(file);
    });
  },
  _removeDoc(type){
    this._state.dokUrls[type]='';
    $('dokumen'+type.charAt(0).toUpperCase()+type.slice(1)+'Preview').classList.remove('visible');
    $('editDokumen'+type.charAt(0).toUpperCase()+type.slice(1)).value='';
    showToast('Dokumen dihapus','info');
  },

    this._set('editIbuKandung',data.ibu_kandung);this._set('editPendidikan',data.pendidikan_terakhir);
    this._set('editAlamat',data.alamat);this._set('editNoHp',data.no_hp);this._set('editEmail',data.email);
    this._set('editNomorRekeningBupati',data.nomor_rekening_bupati);this._set('editNamaBankBupati',data.nama_bank_bupati);

                 (r.name||'').toLowerCase()===String(data.kabupaten_pengajar).toLowerCase();
        });

      nama_bank_bupati:$('editNamaBankBupati').value.trim()||null,
      pemilik_rekening_bupati:$('editPemilikRekeningBupati').value.trim()||null,
      nomor_rekening_gubernur:$('editNomorRekeningGubernur').value.trim()||null,
      nama_bank_gubernur:$('editNamaBankGubernur').value.trim()||null,
      pemilik_rekening_gubernur:$('editPemilikRekeningGubernur').value.trim()||null,
      tmt_mengajar:$('editTmt').value||null,
      status_aktif:$('editStatus').value==='true',
      status_verifikasi:'Pending',
      lembaga_id:sanitizeUUID(u?.lembaga_id),
      kecamatan_lembaga_id:sanitizeUUID(li?.kecamatan_id),
      desa_lembaga_id:sanitizeUUID(li?.desa_id),
      kecamatan_pengajar_id:null, desa_pengajar_id:null,
      jenis_lembaga:li?.jenis_lembaga||'LPQ',
      nslp_lembaga:null,
      dokumen_kyc:JSON.stringify(this._state.dokUrls),
      updated_at:new Date().toISOString()
    };
    if(d.tmt_mengajar){
      const t=new Date(d.tmt_mengajar),n=new Date();
      let y=n.getFullYear()-t.getFullYear();
      const m=n.getMonth()-t.getMonth();
      if(m<0||(m===0&&n.getDate()<t.getDate())) y--;
      d.lama_mengabdi=Math.max(0,y);
    }
    try{
      let err;
      if(isEdit){
        if(this._state.editing?.status_verifikasi==='Diverifikasi') throw new Error('Data sudah diverifikasi!');
        if(this._state.editing?.status_verifikasi==='Ditolak'){d.status_verifikasi='Pending';d.alasan_penolakan=null;}
        const {error}=await supabaseClient.from('pendidik').update(d).eq('id',id);err=error;
      }else{
        d.created_at=new Date().toISOString();
        const {error}=await supabaseClient.from('pendidik').insert([d]);err=error;
      }
      if(err) throw err;
      App.cache.clear();
      showToast(isEdit?'Pengajuan diperbarui!':'Pengajuan dikirim!','success');
      this._closeModal();
      DashboardView.load();
    }catch(e){showToast('Gagal: '+e.message,'error');}
    finally{this._resetBtn(btn);}
  },
  _resetBtn(btn){this._state.saving=false;btn.disabled=false;btn.innerHTML='<i class="fas fa-paper-plane"></i> Ajukan';}
};

  template(){
    return `${welcomeHTML()}
    <div class="stat-mini">
      <div class="stat-item">Total: <strong id="totalPendidikStat">0</strong></div>
      <div class="stat-item">Aktif: <strong id="totalAktif">0</strong></div>

        <button class="btn btn-outline" id="btnReset"><i class="fas fa-undo"></i> Reset</button>
      </div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
        <div class="card-title"><i class="fas fa-list"></i>Daftar Pendidik <small id="totalData">0 data</small></div>
        <button class="btn btn-outline btn-sm" id="btnRefresh"><i class="fas fa-sync"></i> Refresh</button>
      </div>
      <div class="table-responsive"><table><thead><tr><th>No</th><th>NIK</th><th>Nama</th><th>Status</th><th>Verifikasi</th><th>Aksi</th></tr></thead>
      <tbody id="tbody">${tableSpinner(6)}</tbody></table></div>
      ${paginationHTML()}
    </div>
    <div id="modalContainer"></div>`;
  },
  init(){
    $('searchInput').addEventListener('input',debounce(()=>this.applyFilter(),500));
    $('statusFilter').addEventListener('change',()=>this.applyFilter());
    $('verifikasiFilter').addEventListener('change',()=>this.applyFilter());
    $('btnAdd').addEventListener('click',()=>PendidikModal.openAdd(this));
    $('btnImport').addEventListener('click',()=>PendidikModal.openImport(this));
    $('btnExport').addEventListener('click',()=>this.exportData());
    $('btnReset').addEventListener('click',()=>this.resetFilter());
    $('btnRefresh').addEventListener('click',()=>{App.cache.clear();this.load();showToast('Diperbarui','info');});
    $('prevPage').addEventListener('click',()=>this.changePage(-1));
    $('nextPage').addEventListener('click',()=>this.changePage(1));
    this.load();
  },
  destroy(){
    if(this.state.searchTimeout) clearTimeout(this.state.searchTimeout);
    PendidikModal._close();
  },
  applyFilter(){
    this.state.f.search=$('searchInput').value.trim();
    this.state.f.status=$('statusFilter').value;
    this.state.f.verifikasi=$('verifikasiFilter').value;
    this.state.cp=1; this.load();
  },
  resetFilter(){
    $('searchInput').value='';$('statusFilter').value='all';$('verifikasiFilter').value='all';
    this.state.f={search:'',status:'all',verifikasi:'all'};
    this.state.cp=1; this.load();
  },
  async load(){
    const s=this.state, u=App.user;
    if(!u?.lembaga_id) return;
    try{
      let q=supabaseClient.from('pendidik').select('*',{count:'exact'}).eq('lembaga_id',u.lembaga_id);
      if(s.f.search) q=q.or(`nik.ilike.%${s.f.search}%,nama_lengkap.ilike.%${s.f.search}%`);
      if(s.f.status==='active') q=q.eq('status_aktif',true);
      else if(s.f.status==='inactive') q=q.eq('status_aktif',false);
      if(s.f.verifikasi!=='all') q=q.eq('status_verifikasi',s.f.verifikasi);
      const from=(s.cp-1)*s.ps;
      const {data,count}=await q.order('nama_lengkap',{ascending:true}).range(from,from+s.ps-1);
      s.td=count||0;
      this.render(data||[]);
      this.updatePagination();
      this.loadStats();
    }catch(e){$('tbody').innerHTML=tableError(6,e.message);}
  },
  render(data){
    const s=this.state, t=$('tbody');
    st('totalData',`${s.td} data`);
    if(!data.length){t.innerHTML=tableEmpty(6,'📭 Belum ada pendidik');return;}
    const start=(s.cp-1)*s.ps;
    t.innerHTML=data.map((i,n)=>{
      const sb=i.status_aktif?'active':'inactive',stxt=i.status_aktif?'Aktif':'Tidak Aktif';
      let vb='inactive',vt='Draft';
      if(i.status_verifikasi==='Diverifikasi'){vb='active';vt='✓ Terverifikasi';}
      else if(i.status_verifikasi==='Pending'){vb='pending';vt='⏳ Pending';}
      else if(i.status_verifikasi==='Ditolak'){vb='rejected';vt='✗ Ditolak';}
      return `<tr><td>${start+n+1}</td>
        <td><code style="background:#f0f2f5;padding:2px 6px;border-radius:4px;font-size:.7rem;">${i.nik||'-'}</code></td>
        <td><strong>${i.nama_lengkap||'-'}</strong></td>
        <td><span class="badge ${sb}">${stxt}</span></td>
        <td><span class="badge ${vb}" style="font-size:.65rem;">${vt}</span></td>
        <td><div class="action-buttons">
          <button class="btn btn-info btn-xs" data-act="view" data-id="${i.id}"><i class="fas fa-eye"></i></button>
          <button class="btn btn-warning btn-xs" data-act="edit" data-id="${i.id}"><i class="fas fa-edit"></i></button>
          <button class="btn btn-danger btn-xs" data-act="del" data-id="${i.id}"><i class="fas fa-trash"></i></button>
        </div></td></tr>`;
    }).join('');
    t.querySelectorAll('[data-act]').forEach(b=>{
      b.addEventListener('click',e=>{
        e.stopPropagation();
        const id=b.dataset.id,a=b.dataset.act;
        if(a==='view') PendidikModal.openView(this,id);
        else if(a==='edit') PendidikModal.openEdit(this,id);
        else if(a==='del') this.deleteRow(id);
      });
    });
  },
  async deleteRow(id){
    if(!confirm('Yakin hapus pendidik ini?')) return;
    try{
      const {error}=await supabaseClient.from('pendidik').delete().eq('id',id);
      if(error) throw error;
      App.cache.clear();
      showToast('Dihapus','success');
      this.load();
    }catch(e){showToast('Gagal: '+e.message,'error');}
  },
  async loadStats(){
    const u=App.user; if(!u?.lembaga_id) return;
    const {data}=await supabaseClient.from('pendidik').select('status_aktif,status_verifikasi').eq('lembaga_id',u.lembaga_id);
    const d=data||[];
    st('totalPendidikStat',d.length);
    st('totalAktif',d.filter(x=>x.status_aktif).length);
    st('totalNonaktif',d.filter(x=>!x.status_aktif).length);
    st('totalPending',d.filter(x=>['Draft','Pending'].includes(x.status_verifikasi)).length);
  },
  updatePagination(){
    const s=this.state, tp=Math.ceil(s.td/s.ps);
    st('pageInfo',`Halaman ${s.cp} dari ${tp||1}`);
    $('prevPage').disabled=s.cp<=1;
    $('nextPage').disabled=s.cp>=tp;
  },
  changePage(d){
    const s=this.state,tp=Math.ceil(s.td/s.ps),np=s.cp+d;
    if(np<1||np>tp) return;
    s.cp=np; this.load();
  },
  async exportData(){
    if(this.state.xlsxBusy) return;
    this.state.xlsxBusy=true;
    try{
      showToast('Memuat modul Excel...','info');
      await loadXLSX();
      const u=App.user;
      const {data}=await supabaseClient.from('pendidik').select('*').eq('lembaga_id',u.lembaga_id).order('nama_lengkap');
      if(!data||!data.length){showToast('Tidak ada data','warning');return;}
      const h=['NIK','Nama Lengkap','Tempat Lahir','Tanggal Lahir','Jenis Kelamin','Status Perkawinan','Ibu Kandung','Pendidikan','Alamat','No HP','Email','No Rek Bupati','Bank Bupati','Pemilik Rek Bupati','No Rek Gubernur','Bank Gubernur','Pemilik Rek Gubernur','TMT','Lama Mengabdi','Lembaga','Jenis','Status','Verifikasi'];
      const rows=data.map(i=>[i.nik,i.nama_lengkap,i.tempat_lahir,i.tanggal_lahir,i.jenis_kelamin,i.status_perkawinan,i.ibu_kandung,i.pendidikan_terakhir,i.alamat,i.no_hp,i.email,i.nomor_rekening_bupati,i.nama_bank_bupati,i.pemilik_rekening_bupati,i.nomor_rekening_gubernur,i.nama_bank_gubernur,i.pemilik_rekening_gubernur,i.tmt_mengajar,i.lama_mengabdi,App.lembagaInfo?.nama||'',i.jenis_lembaga||'LPQ',i.status_aktif?'Aktif':'Tidak Aktif',i.status_verifikasi||'Draft']);
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([h,...rows]),'Pendidik');
      XLSX.writeFile(wb,`data_pendidik_${new Date().toISOString().split('T')[0]}.xlsx`);
      showToast(`Export ${data.length} data`,'success');
    }catch(e){showToast('Gagal: '+e.message,'error');}
    finally{this.state.xlsxBusy=false;}
  }
};

  _hitungLama(){

  async _fill(data){

  openImport(view){
    $('modalContainer').innerHTML=`<div class="modal-overlay active" id="pendidikModal2"><div class="modal-container" style="max-width:450px;">

        <p style="font-size:.9rem;color:#666;margin-bottom:12px;">Upload file Excel (.xlsx)</p>

        <input type="file" id="fileImport" accept=".xlsx,.xls" style="width:100%;padding:8px;border:2px solid #e0e0e0;border-radius:8px;">

      <div class="modal-footer">

  async _template(){
    await loadXLSX();
    const h=['NIK','Nama Lengkap','Tempat Lahir','Tanggal Lahir','Jenis Kelamin','Status Perkawinan','Ibu Kandung','Pendidikan Terakhir','Alamat','No HP','Email','No Rek Bupati','Bank Bupati','Pemilik Rek Bupati','No Rek Gubernur','Bank Gubernur','Pemilik Rek Gubernur','TMT Mengajar','Lama Mengabdi','Lembaga','Jenis Lembaga','Status'];
    const r=['3328123401234567','Ahmad Fauzi','Tegal','1990-01-15','LAKI-LAKI','Menikah','Siti Aminah','S1','Jl. Merdeka No. 5','08123456789','ahmad@email.com','1234567890','BRI','Ahmad Fauzi','0987654321','BNI','Ahmad Fauzi','2020-07-01','3','MDT Al-Falah','MDT','Aktif'];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([h,r]),'Template');
    XLSX.writeFile(wb,'template_pendidik.xlsx');
    showToast('Template diunduh','success');
  },
  async _import(){
    const f=$('fileImport').files[0];
    if(!f){showToast('Pilih file!','error');return;}
    const btn=$('btnDoImport');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i>';
    showToast('Memuat modul Excel...','info');
    try{
      await loadXLSX();
      const buf=await f.arrayBuffer();
      const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
      const json=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      if(!json.length){showToast('File kosong!','error');return;}
      const {data:kecData}=await supabaseClient.from('master_kecamatan').select('id,nama');
      const km={};kecData.forEach(k=>km[k.nama.toLowerCase()]=k.id);
      const {data:desaData}=await supabaseClient.from('master_kelurahan').select('id,nama,kecamatan_id');
      const dm={};desaData.forEach(d=>dm[d.nama.toLowerCase()]=d);
      let s=0,fc=0;
      for(const row of json){
        try{
          const nik=row['NIK']?.toString().replace(/\D/g,'')||'';
          if(!nik||nik.length!==16){fc++;continue;}
          const nama=row['Nama Lengkap']||'';
          if(!nama){fc++;continue;}
          const kn=(row['Kecamatan Pengajar']||'').toLowerCase();
          const dn=(row['Desa Pengajar']||'').toLowerCase();
          let kid=km[kn]||null,did=null;
          if(dn&&dm[dn]){const de=dm[dn];if(!kid||de.kecamatan_id===kid){did=de.id;if(!kid)kid=de.kecamatan_id;}}
          const status=row['Status']||'Aktif';
          const {error}=await supabaseClient.from('pendidik').insert([{
            nik,nama_lengkap:nama,
            tempat_lahir:row['Tempat Lahir']||'',
            tanggal_lahir:this._parseDate(row['Tanggal Lahir']),
            jenis_kelamin:(row['Jenis Kelamin']||'').toUpperCase().includes('LAKI')?'LAKI-LAKI':'PEREMPUAN',
            status_perkawinan:row['Status Perkawinan']||'',
            ibu_kandung:row['Ibu Kandung']||'',
            pendidikan_terakhir:row['Pendidikan Terakhir']||'',
            alamat:row['Alamat']||'',
            no_hp:row['No HP']?.toString()||'',
            email:row['Email']||'',
            nomor_rekening_bupati:row['No Rek Bupati']?.toString()||'',
            nama_bank_bupati:row['Bank Bupati']||'',
            pemilik_rekening_bupati:row['Pemilik Rek Bupati']||'',
            nomor_rekening_gubernur:row['No Rek Gubernur']?.toString()||'',
            nama_bank_gubernur:row['Bank Gubernur']||'',
            pemilik_rekening_gubernur:row['Pemilik Rek Gubernur']||'',
            desa_pengajar_id:did,kecamatan_pengajar_id:kid,
            kabupaten_pengajar:row['Kabupaten Pengajar']||'Tegal',
            provinsi:row['Provinsi']||'Jawa Tengah',
            tmt_mengajar:this._parseDate(row['TMT Mengajar']),
            lama_mengabdi:parseInt(row['Lama Mengabdi'])||0,
            lembaga_id:App.user.lembaga_id,
            nslp_lembaga:App.lembagaInfo?.nslp||'',
            jenis_lembaga:this._mapJenjang(row['Jenis Lembaga']),
            status_aktif:status.toLowerCase()==='aktif',
            status_verifikasi:'Draft',
            created_at:new Date().toISOString(),
            updated_at:new Date().toISOString()
          }]);
          if(error) throw error;
          s++;
        }catch(e){fc++;}
      }
      App.cache.clear();
      showToast(`Import: ${s} berhasil, ${fc} gagal`,s>0?'success':'error');
      this._close();
      PendidikView.load();
    }catch(e){showToast('Gagal: '+e.message,'error');}
    finally{btn.disabled=false;btn.innerHTML='<i class="fas fa-upload"></i> Upload';}
  },
  _parseDate(d){
    if(!d)return null;
    if(typeof d==='number'){const e=new Date((d-25569)*86400*1000);return isNaN(e)?null:e.toISOString().split('T')[0];}
    if(typeof d==='string'){
      const c=d.trim();
      if(c.includes('/')){const p=c.split('/');if(p.length===3)return `${p[2].length===2?'20'+p[2]:p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;}
      if(c.match(/^\d{4}-\d{2}-\d{2}$/))return c;
    }
    return null;
  },
  _mapJenjang(v){
    const m={'MADIN':'MDT','MDT_ULA':'MDT','MDT_WUSTHA':'MDT','MDT_ULYA':'MDT','TPQ':'LPQ','TQA':'LPQ','TKQ':'LPQ','PAUDQU':'LPQ','RTQ':'LPQ','SALAF':'PONPES','PDF':'PONPES','SPM':'PONPES','PKPPS':'PONPES','LPQ':'LPQ','MDT':'MDT','PONPES':'PONPES'};
    return m[v]||'LPQ';
  }
};

const BantuanModal = {
  _state:{po:[],saving:false},
  _close(){const m=$('bantuanModal2');if(m)m.remove();},
  async _loadPendidik(){
    const u=App.user;if(!u?.lembaga_id) return;
    const {data}=await supabaseClient.from('pendidik').select('id,nik,nama_lengkap').eq('lembaga_id',u.lembaga_id).eq('status_aktif',true).order('nama_lengkap');

  },

    $('modalContainer').innerHTML=`<div class="modal-overlay active" id="bantuanModal2"><div class="modal-container" style="max-width:550px;">
      <div class="modal-header"><h2>Tambah Bantuan</h2><button class="close-btn" data-close><i class="fas fa-times"></i></button></div>
      <div class="modal-body">
        <input type="hidden" id="bId">

        <div class="form-group"><label>Jenis <span style="color:red;">*</span></label><select id="bJenis"><option value="kabupaten">Kabupaten</option><option value="provinsi">Provinsi</option><option value="kemenag">Kemenag</option><option value="lainnya">Lainnya</option></select></div>
        <div class="form-group"><label>Nominal (Rp) <span style="color:red;">*</span></label><input type="number" id="bNominal" min="0" step="1000"></div>
        <div class="form-group"><label>Tahun <span style="color:red;">*</span></label><input type="number" id="bTahun" value="${new Date().getFullYear()}" min="2000" max="2099"></div>
        <div class="form-group"><label>Status</label><select id="bStatus"><option value="pengajuan_baru">Pengajuan Baru</option><option value="penerima_sebelumnya">Penerima Sebelumnya</option></select></div>
        <div class="form-group"><label>Keterangan</label><textarea id="bKet"></textarea></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" data-close>Batal</button>
        <button class="btn btn-success" id="bSave"><i class="fas fa-save"></i> Simpan</button>
      </div>
    </div></div>`;
    document.querySelectorAll('#bantuanModal2 [data-close]').forEach(b=>b.addEventListener('click',()=>this._close()));
    $('bSave').addEventListener('click',()=>this._save());
    this._state.saving=false;
  },
  async openView(view,id){
    const {data}=await supabaseClient.from('bantuan').select('*').eq('id',id).single();
    if(!data){showToast('Tidak ditemukan','error');return;}
    await this._loadPendidik();
    const opts=this._state.po.map(p=>`<option value="${p.id}" ${data.pendidik_id===p.id?'selected':''}>${p.nama_lengkap} (${p.nik})</option>`).join('');
    const SL={pengajuan_baru:'Pengajuan Baru',penerima_sebelumnya:'Penerima Sebelumnya',proses_verifikasi:'Proses Verifikasi',disetujui:'Disetujui',proses_pencairan:'Proses Pencairan',cair:'Cair',batal:'Batal'};
    $('modalContainer').innerHTML=`<div class="modal-overlay active" id="bantuanModal2"><div class="modal-container" style="max-width:550px;">
      <div class="modal-header"><h2>Detail Bantuan</h2><button class="close-btn" data-close><i class="fas fa-times"></i></button></div>
      <div class="modal-body">
        <div style="text-align:center;margin-bottom:16px;"><span class="status-badge-large badge-${data.status}">Status: ${SL[data.status]||data.status}</span></div>
        <div class="form-group"><label>Pendidik</label><select disabled>${opts}</select></div>
        <div class="form-group"><label>Jenis</label><input type="text" value="${(data.jenis||'').charAt(0).toUpperCase()+(data.jenis||'').slice(1)}" disabled></div>
        <div class="form-group"><label>Nominal</label><input type="text" value="Rp ${fmtRupiah(data.nominal)}" disabled></div>
        <div class="form-group"><label>Tahun</label><input type="text" value="${data.tahun_anggaran||'-'}" disabled></div>
        <div class="form-group"><label>Keterangan</label><textarea disabled>${data.keterangan||'-'}</textarea></div>
      </div>
      <div class="modal-footer"><button class="btn btn-outline" data-close>Tutup</button></div>
    </div></div>`;
    document.querySelectorAll('#bantuanModal2 [data-close]').forEach(b=>b.addEventListener('click',()=>this._close()));
  },
  async _save(){
    if(this._state.saving){showToast('Sedang memproses...','warning');return;}
    const pid=$('bPid').value,jenis=$('bJenis').value,nominal=parseFloat($('bNominal').value),tahun=parseInt($('bTahun').value),status=$('bStatus').value,ket=$('bKet').value.trim();
    if(!pid){showToast('Pilih pendidik!','error');return;}
    if(!nominal||nominal<=0){showToast('Nominal > 0!','error');return;}
    if(!tahun||tahun<2000||tahun>2099){showToast('Tahun tidak valid!','error');return;}
    const u=App.user;
    const {data:pc}=await supabaseClient.from('pendidik').select('id').eq('id',pid).eq('lembaga_id',u.lembaga_id).single();
    if(!pc){showToast('Pendidik tidak di lembaga Anda!','error');return;}
    const btn=$('bSave');this._state.saving=true;btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
    const d={pendidik_id:pid,jenis,nominal,tahun_anggaran:tahun,status,keterangan:ket,updated_at:new Date().toISOString(),created_at:new Date().toISOString()};
    try{
      const {error}=await supabaseClient.from('bantuan').insert([d]);
      if(error) throw error;
      App.cache.clear();showToast('Berhasil ditambahkan!','success');
      this._close();
      BantuanView.loadTahunFilter().then(()=>BantuanView.load());
    }catch(e){showToast('Gagal: '+e.message,'error');}
    finally{this._state.saving=false;btn.disabled=false;btn.innerHTML='<i class="fas fa-save"></i> Simpan';}
  },
  openImport(view){
    $('modalContainer').innerHTML=`<div class="modal-overlay active" id="bantuanModal2"><div class="modal-container" style="max-width:450px;">
      <div class="modal-header"><h2>Import Bantuan</h2><button class="close-btn" data-close><i class="fas fa-times"></i></button></div>
      <div class="modal-body">
        <p style="font-size:.9rem;color:#666;margin-bottom:12px;">Upload Excel (.xlsx)</p>
        <div style="margin-bottom:12px;"><button class="btn btn-outline" id="bTpl"><i class="fas fa-download"></i> Template</button></div>
        <input type="file" id="bFile" accept=".xlsx,.xls" style="width:100%;padding:8px;border:2px solid #e0e0e0;border-radius:8px;">
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" data-close>Batal</button>
        <button class="btn btn-success" id="bDoImport"><i class="fas fa-upload"></i> Upload</button>
      </div>
    </div></div>`;
    document.querySelectorAll('#bantuanModal2 [data-close]').forEach(b=>b.addEventListener('click',()=>this._close()));
    $('bTpl').addEventListener('click',()=>this._template());
    $('bDoImport').addEventListener('click',()=>this._import());
  },
  async _template(){
    await loadXLSX();
    const h=['NIK','Jenis Bantuan','Nominal','Tahun','Status','Keterangan'];
    const r=['3328123401234567','kabupaten','500000','2026','pengajuan_baru',''];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([h,r]),'Template');
    XLSX.writeFile(wb,'template_bantuan.xlsx');
    showToast('Template diunduh','success');
  },
  async _import(){
    const f=$('bFile').files[0];
    if(!f){showToast('Pilih file!','error');return;}
    const btn=$('bDoImport');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i>';
    try{
      await loadXLSX();
      const buf=await f.arrayBuffer();
      const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
      const json=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      if(!json.length){showToast('File kosong!','error');return;}
      const u=App.user;
      const {data:pd}=await supabaseClient.from('pendidik').select('id,nik,nama_lengkap').eq('lembaga_id',u.lembaga_id);
      const nm={},nn={};(pd||[]).forEach(p=>{nm[p.nik]=p.id;nn[p.nama_lengkap]=p.id;});
      let s=0,fc=0;
      const vs=['pengajuan_baru','penerima_sebelumnya','proses_verifikasi','disetujui','proses_pencairan','cair','batal'];
      for(const row of json){
        try{
          const nk=row['NIK']?.toString().trim()||'',nma=row['Nama Pendidik']||row['Nama']||'',pid=nm[nk]||nn[nma];
          if(!pid){fc++;continue;}
          const nominal=parseFloat(row['Nominal'])||0;
          if(nominal<=0){fc++;continue;}
          const st=row['Status']?.toLowerCase()||'pengajuan_baru';
          const {error}=await supabaseClient.from('bantuan').insert([{
            pendidik_id:pid,jenis:row['Jenis Bantuan']||'kabupaten',nominal,
            tahun_anggaran:parseInt(row['Tahun'])||new Date().getFullYear(),
            status:vs.includes(st)?st:'pengajuan_baru',
            keterangan:row['Keterangan']||'',
            created_at:new Date().toISOString(),updated_at:new Date().toISOString()
          }]);
          if(error) throw error;
          s++;
        }catch(e){fc++;}
      }
      App.cache.clear();
      showToast(`Import: ${s} berhasil, ${fc} gagal`,s>0?'success':'error');
      this._close();
      BantuanView.loadTahunFilter().then(()=>BantuanView.load());
    }catch(e){showToast('Gagal: '+e.message,'error');}
    finally{btn.disabled=false;btn.innerHTML='<i class="fas fa-upload"></i> Upload';}
  }
};

    </div>

  },
  init(){
    $('searchInput').addEventListener('input',debounce(()=>{this.applyFilter();},500));
    $('filterStatus').addEventListener('change',()=>this.applyFilter());
    $('btnReset').addEventListener('click',()=>this.resetFilter());
    $('btnAjukan').addEventListener('click',()=>MutasiModal.openAjukan(this));
    $('btnRefresh').addEventListener('click',()=>{App.cache.clear();this.loadOptions().then(()=>this.load());showToast('Diperbarui','info');});
    $('btnClearSearch').addEventListener('click',()=>{$('searchInput').value='';this.applyFilter();});

  applyFilter(){this.state.cp=1;this.load();},

  async loadOptions(){
    const u=App.user;if(!u?.lembaga_id) return;
    const [pd,lb]=await Promise.all([
      supabaseClient.from('pendidik').select('id,nik,nama_lengkap,lembaga_id').eq('status_aktif',true).eq('lembaga_id',u.lembaga_id).order('nama_lengkap'),

      let q=supabaseClient.from('mutasi').select(`*,pendidik:pendidik_id(id,nik,nama_lengkap),dari_lembaga:dari_lembaga_id(id,nama,jenis_lembaga),ke_lembaga:ke_lembaga_id(id,nama,jenis_lembaga),diajukan_oleh_user:diajukan_oleh(id,name)`,{count:'exact'}).eq('dari_lembaga_id',u.lembaga_id);

      if(sv) q=q.ilike('nomor_mutasi',`%${sv}%`);

      if(sf!=='all') q=q.eq('status',sf);
      const from=(s.cp-1)*s.ps;
      const {data,count}=await q.order('created_at',{ascending:false}).range(from,from+s.ps-1);
      let list=data||[];
      if(sv){
        const sl=sv.toLowerCase();
        list=list.filter(i=>(i.nomor_mutasi||'').toLowerCase().includes(sl)||(i.pendidik?.nama_lengkap||'').toLowerCase().includes(sl)||(i.pendidik?.nik||'').includes(sl));

async _generateNomorMutasi(){
  const n=new Date();
  const y=n.getFullYear();
  const m=String(n.getMonth()+1).padStart(2,'0');
  const prefix=`MUT/${y}/${m}/`;
  const {data}=await supabaseClient
    .from('mutasi')
    .select('nomor_mutasi')
    .like('nomor_mutasi',`${prefix}%`)
    .order('nomor_mutasi',{ascending:false})
    .limit(1);
  let seq=1;
  if(data&&data.length){
    const last=data[0].nomor_mutasi||'';
    const match=last.match(/\/(\d+)\s*$/);
    if(match) seq=parseInt(match[1],10)+1;
  }
  return `${prefix}${String(seq).padStart(3,'0')}`;
},

async _save(view){
  const pid=$('mPid').value, did=$('mAsalId').value, kid=$('mTujuanId').value;
  const jenis=$('mJenis').value, tgl=$('mTanggal').value, alasanSel=$('mAlasan').value;
  const alasanLain=$('mAlasanLain').value.trim(), ket=$('mKet').value.trim();
  if(!pid||!did||!kid||!tgl||!alasanSel){showToast('Semua field wajib diisi!','error');return;}
  if(did===kid){showToast('Asal dan tujuan tidak boleh sama!','error');return;}
  if(alasanSel==='lainnya'&&!alasanLain){showToast('Isi alasan lainnya!','error');return;}
  const alasan=alasanSel==='lainnya'?alasanLain:alasanSel;
  const btn=$('mSave');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Mengirim...';

  const baseData={
    pendidik_id:pid,dari_lembaga_id:did,ke_lembaga_id:kid,
    jenis_mutasi:jenis,tanggal_mutasi:tgl,alasan_mutasi:alasan,keterangan:ket,
    status:'diajukan',diajukan_oleh:App.user.id,
    updated_at:new Date().toISOString()
  };

  let lastErr=null;
  // Retry maks 5x untuk handle race condition (2 user simpan bersamaan)
  for(let attempt=0;attempt<5;attempt++){
    try{
      const nomor=await this._generateNomorMutasi();
      const {error}=await supabaseClient.from('mutasi').insert([{
        ...baseData, nomor_mutasi:nomor,
        created_at:new Date().toISOString()
      }]);
      if(error){
        // Jika duplicate key → coba nomor berikutnya
        if(/duplicate|unique|23505/i.test(error.message||'')){
          lastErr=error;
          await new Promise(r=>setTimeout(r,150)); // jeda kecil sebelum retry
          continue;
        }
        throw error;
      }
      // Sukses
      App.cache.clear();
      showToast('Pengajuan berhasil dikirim!','success');
      this._close();
      view.load();
      btn.disabled=false;
      btn.innerHTML='<i class="fas fa-paper-plane"></i> Ajukan';
      return;
    }catch(e){
      lastErr=e;
    }
  }

  // Kalau semua percobaan gagal
  showToast('Gagal: '+(lastErr?.message||'Tidak dapat generate nomor unik'),'error');
  btn.disabled=false;
  btn.innerHTML='<i class="fas fa-paper-plane"></i> Ajukan';
}
};
